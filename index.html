<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>GAME ZONE OS v2.0</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap');

        :root {
            --win-bg: #008080; 
            --gray: #c0c0c0;
            --win-blue: #000080;
            --white: #ffffff;
            --black: #000000;
            --dark-gray: #808080;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Cairo', sans-serif; }
        
        body { background: var(--win-bg); height: 100vh; display: flex; flex-direction: column; overflow: hidden; }

        /* تأثير الشاشة القديمة */
        body::before {
            content: " "; display: block; position: absolute; top: 0; left: 0; bottom: 0; right: 0;
            background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.1) 50%), linear-gradient(90deg, rgba(255, 0, 0, 0.03), rgba(0, 255, 0, 0.01), rgba(0, 0, 255, 0.03));
            z-index: 9999; background-size: 100% 3px, 3px 100%; pointer-events: none;
        }

        /* تصميم النوافذ */
        .window { background: var(--gray); border: 2px solid var(--white); border-right-color: var(--black); border-bottom-color: var(--black); padding: 2px; position: relative; }
        .window-title { background: var(--win-blue); color: var(--white); padding: 3px 6px; font-weight: bold; font-size: 0.85rem; display: flex; justify-content: space-between; align-items: center; }
        .window-body { padding: 10px; background: var(--gray); }

        /* تسجيل الدخول */
        #auth-overlay { position: fixed; inset: 0; background: var(--win-bg); z-index: 10000; display: flex; justify-content: center; align-items: center; padding: 20px; }
        .input-classic { width: 100%; padding: 8px; border: 2px solid var(--black); border-right-color: var(--white); border-bottom-color: var(--white); background: #fff; margin-bottom: 10px; }
        .btn-classic { padding: 5px 15px; background: var(--gray); border: 2px solid var(--white); border-right-color: var(--black); border-bottom-color: var(--black); cursor: pointer; font-weight: bold; }
        .btn-classic:active { border: 2px solid var(--black); border-right-color: var(--white); border-bottom-color: var(--white); }

        /* منطقة العمل */
        #desktop { display: none; flex-direction: column; height: 100vh; }
        #chat-window { flex: 1; margin: 10px; display: flex; flex-direction: column; }
        .msg-display { flex: 1; background: #fff; border: 2px solid var(--dark-gray); overflow-y: auto; padding: 10px; }

        /* الرسائل والرتب */
        .msg { margin-bottom: 12px; display: flex; flex-direction: column; }
        .msg-info { font-size: 0.75rem; font-weight: bold; cursor: pointer; margin-bottom: 3px; }
        .bubble { display: inline-block; padding: 6px 10px; border: 1px solid var(--dark-gray); background: #f0f0f0; max-width: 85%; word-break: break-all; }
        .me { align-self: flex-end; text-align: left; }
        .me .bubble { background: #ffffca; border-color: var(--win-blue); }

        .rank-tag { color: #fff; padding: 1px 4px; font-size: 0.6rem; margin-left: 5px; text-transform: uppercase; }
        .founder { background: #ff0000; }
        .legend { background: #800080; }
        .active { background: #0000ff; }
        .newbie { background: #808080; }

        /* شريط المهام السفلي */
        .taskbar { height: 40px; background: var(--gray); border-top: 2px solid var(--white); display: flex; align-items: center; padding: 2px 5px; gap: 5px; z-index: 1000; }
        .start-btn { background: var(--gray); border: 2px solid var(--white); border-right-color: var(--black); border-bottom-color: var(--black); padding: 2px 8px; font-weight: 900; display: flex; align-items: center; gap: 5px; }
        #messageInput { flex: 1; height: 28px; border: 2px solid var(--black); border-right-color: var(--white); border-bottom-color: var(--white); padding: 0 10px; }

        /* نافذة التحكم (ابدأ) */
        #start-menu { position: absolute; bottom: 42px; right: 5px; width: 200px; display: none; }
        .menu-item { padding: 8px; cursor: pointer; border-bottom: 1px solid var(--dark-gray); font-size: 0.8rem; }
        .menu-item:hover { background: var(--win-blue); color: #fff; }

        @media (max-width: 600px) { .window { width: 95%; } .bubble { max-width: 90%; } }
    </style>
</head>
<body>

<div id="auth-overlay">
    <div class="window" id="login-window" style="width: 320px;">
        <div class="window-title"><span>Login_Manager.exe</span></div>
        <div class="window-body">
            <input type="email" id="email" class="input-classic" placeholder="البريد الإلكتروني">
            <input type="password" id="pass" class="input-classic" placeholder="كلمة السر">
            <button class="btn-classic" onclick="authSystem()">دخول</button>
        </div>
    </div>

    <div class="window" id="nick-window" style="display: none; width: 300px;">
        <div class="window-title"><span>User_Profile.sys</span></div>
        <div class="window-body">
            <p style="font-size: 0.8rem; margin-bottom: 10px;">أهلاً بك في GAME ZONE! اختر لقبك:</p>
            <input type="text" id="nickInput" class="input-classic" placeholder="الاسم المستعار...">
            <button class="btn-classic" onclick="saveNick()">ابدأ النظام</button>
        </div>
    </div>
</div>

<div id="desktop">
    <div class="window" id="chat-window">
        <div class="window-title">
            <span><i class="fas fa-comment"></i> GAME_ZONE_CHAT.exe</span>
            <span onclick="location.reload()" style="cursor:pointer">[X]</span>
        </div>
        <div class="msg-display" id="msgBox"></div>
    </div>

    <div class="taskbar">
        <button class="start-btn" onclick="toggleStart()"><i class="fas fa-user-shield"></i> ابدأ</button>
        <input type="text" id="messageInput" placeholder="اكتب رسالة هنا...">
        <button class="btn-classic" onclick="sendMessage()">إرسال</button>
    </div>

    <div id="start-menu" class="window">
        <div class="window-title"><span>Admin_Tools</span></div>
        <div class="window-body" id="adminList" style="padding:0">
            <div class="menu-item" onclick="clearZone()">تطهير الشات</div>
            <div id="userLinks"></div>
        </div>
    </div>
</div>

<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>

<script>
const FOUNDER_ID = "abdarahman10555@gmail.com";
const firebaseConfig = {
    apiKey: "AIzaSyBqu1IE24FhA-govU_swQ4IcynOj4AB-ao",
    authDomain: "game-zone-chat1.firebaseapp.com",
    projectId: "game-zone-chat1",
    storageBucket: "game-zone-chat1.firebasestorage.app",
    messagingSenderId: "932733239188",
    appId: "1:932733239188:web:634fbfc00a396c761a1981"
};

firebase.initializeApp(firebaseConfig);
const db = firebase.firestore();
const auth = firebase.auth();

// حساب الرتبة بالوقت
function getRank(joinDate, email) {
    if (email === FOUNDER_ID) return { n: "مؤسس", c: "founder" };
    if (!joinDate) return { n: "جديد", c: "newbie" };
    const days = Math.floor((new Date() - joinDate.toDate()) / (1000 * 60 * 60 * 24));
    if (days >= 30) return { n: "أسطورة", c: "legend" };
    if (days >= 3) return { n: "نشط", c: "active" };
    return { n: "جديد", c: "newbie" };
}

async function authSystem() {
    const e = document.getElementById('email').value;
    const p = document.getElementById('pass').value;
    try { await auth.signInWithEmailAndPassword(e, p); } 
    catch { await auth.createUserWithEmailAndPassword(e, p); }
}

auth.onAuthStateChanged(async user => {
    if(user) {
        document.getElementById('login-window').style.display = 'none';
        const doc = await db.collection('users').doc(user.email).get();
        if(!doc.exists) document.getElementById('nick-window').style.display = 'block';
        else startSystem();
    }
});

async function saveNick() {
    const n = document.getElementById('nickInput').value;
    if(!n) return;
    await db.collection('users').doc(auth.currentUser.email).set({
        nickname: n, joinDate: firebase.firestore.FieldValue.serverTimestamp(), email: auth.currentUser.email
    });
    startSystem();
}

function startSystem() {
    document.getElementById('auth-overlay').style.display = 'none';
    document.getElementById('desktop').style.display = 'flex';
    listenMessages();
    if(auth.currentUser.email === FOUNDER_ID) loadAdmin();
}

function toggleStart() {
    const menu = document.getElementById('start-menu');
    menu.style.display = menu.style.display === 'block' ? 'none' : 'block';
}

async function sendMessage() {
    const inp = document.getElementById('messageInput');
    if(!inp.value.trim()) return;
    const userDoc = await db.collection('users').doc(auth.currentUser.email).get();
    const u = userDoc.data();
    await db.collection('messages').add({
        text: inp.value, sender: u.email, nickname: u.nickname,
        joinDate: u.joinDate, time: firebase.firestore.FieldValue.serverTimestamp()
    });
    inp.value = "";
}

function listenMessages() {
    db.collection('messages').orderBy('time').onSnapshot(snap => {
        const box = document.getElementById('msgBox');
        box.innerHTML = "";
        snap.forEach(doc => {
            const m = doc.data();
            const isMe = m.sender === auth.currentUser.email;
            const rank = getRank(m.joinDate, m.sender);
            const div = document.createElement('div');
            div.className = `msg ${isMe ? 'me' : ''}`;
            div.innerHTML = `
                <div class="msg-info" onclick="alert('الاسم: ${m.nickname}\\nالرتبة: ${rank.n}')">
                    <span class="rank-tag ${rank.c}">${rank.n}</span> ${m.nickname}
                </div>
                <div class="bubble">${m.text}</div>
            `;
            box.appendChild(div);
        });
        box.scrollTop = box.scrollHeight;
    });
}

function loadAdmin() {
    db.collection('users').onSnapshot(snap => {
        const list = document.getElementById('userLinks');
        list.innerHTML = "<p style='padding:5px; font-size:0.7rem; color:blue'>إدارة الأعضاء:</p>";
        snap.forEach(doc => {
            if(doc.id === FOUNDER_ID) return;
            const d = document.createElement('div');
            d.className = "menu-item";
            d.innerText = `🚫 ${doc.data().nickname}`;
            d.onclick = () => { if(confirm("كتم الشخص؟")) db.collection('mutes').doc(doc.id).set({m:true}); };
            list.appendChild(d);
        });
    });
}

async function clearZone() { if(confirm("مسح الكل؟")) { const s = await db.collection('messages').get(); s.forEach(d => d.ref.delete()); } }
document.getElementById('messageInput').addEventListener('keypress', e => { if(e.key==='Enter') sendMessage(); });
</script>
</body>
</html>
