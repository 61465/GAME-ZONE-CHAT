<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Game Zone Chat | Founder Edition</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-black: #050505;
            --gold-main: #D4AF37;
            --gold-glow: #FFD700;
            --dark-card: #121212;
            --text-white: #ffffff;
            --founder-red: #ff0000;
        }

        body {
            font-family: 'Cairo', sans-serif;
            background-color: var(--bg-black);
            color: var(--text-white);
            margin: 0;
            display: flex;
            flex-direction: column;
            height: 100vh;
            overflow: hidden;
        }

        #login-screen {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.98);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }
        .login-box {
            background: var(--dark-card);
            padding: 40px;
            border-radius: 15px;
            border: 2px solid var(--gold-main);
            text-align: center;
            box-shadow: 0 0 30px rgba(212, 175, 55, 0.3);
            width: 90%;
            max-width: 400px;
        }

        header {
            background: var(--dark-card);
            padding: 15px 25px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 2px solid var(--gold-main);
        }

        #chat-container {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 15px;
            background: radial-gradient(circle at center, #1a1a1a 0%, #050505 100%);
        }

        .message {
            background: #1a1a1a;
            padding: 12px 18px;
            border-radius: 12px;
            max-width: 80%;
            align-self: flex-start;
            border: 1px solid #333;
            border-right: 4px solid var(--gold-main);
            animation: fadeIn 0.3s ease;
        }

        .msg-founder {
            border: 2px solid var(--gold-main) !important;
            border-right: 8px solid var(--founder-red) !important;
            box-shadow: 0 0 15px rgba(212, 175, 55, 0.4);
            background: #000 !important;
        }

        .rank-founder {
            color: var(--founder-red) !important;
            text-shadow: 0 0 10px var(--founder-red), 0 0 20px var(--gold-main);
            font-weight: 900;
            animation: founderPulse 1.5s infinite alternate;
        }

        @keyframes founderPulse {
            from { opacity: 0.8; transform: scale(1); }
            to { opacity: 1; transform: scale(1.02); }
        }

        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

        .msg-info {
            font-size: 0.8rem;
            margin-bottom: 5px;
            display: flex; gap: 10px; font-weight: bold; color: var(--gold-main);
        }

        .input-box {
            background: var(--dark-card);
            padding: 20px;
            display: flex;
            gap: 10px;
            border-top: 2px solid var(--gold-main);
        }

        input {
            flex: 1;
            background: #000;
            border: 1px solid var(--gold-main);
            padding: 12px;
            border-radius: 8px;
            color: #fff;
            outline: none;
            font-family: 'Cairo';
            margin-bottom: 10px;
            width: 100%;
            box-sizing: border-box;
            text-align: center;
        }

        button {
            background: var(--gold-main);
            color: black;
            border: none;
            padding: 12px 25px;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
            width: 100%;
        }

        #admin-modal {
            display: none;
            position: fixed;
            top: 50%; left: 50%; transform: translate(-50%, -50%);
            background: #1a1a1a; border: 2px solid var(--gold-main);
            padding: 20px; z-index: 2000; border-radius: 12px; text-align: center;
        }
    </style>
</head>
<body>

<div id="login-screen">
    <div class="login-box">
        <h1 style="color: var(--gold-main); font-weight: 900;">GAME ZONE VIP</h1>
        
        <div id="login-form">
            <p style="color: #aaa;">تسجيل الدخول</p>
            <input type="email" id="email" placeholder="البريد الإلكتروني">
            <input type="password" id="password" placeholder="كلمة السر">
            <button onclick="handleLogin()">دخول المجلس</button>
            <p style="font-size: 0.8rem; margin-top: 15px;">ليس لديك حساب؟ <a href="javascript:void(0)" onclick="showPage('reg')" style="color: var(--gold-main);">إنشاء حساب جديد</a></p>
        </div>

        <div id="reg-form" style="display: none;">
            <p style="color: var(--gold-main); font-weight: bold;">إنشاء حساب جديد</p>
            <input type="email" id="reg-email" placeholder="البريد الإلكتروني">
            <input type="password" id="reg-password" placeholder="كلمة السر (6 أحرف فأكثر)">
            <input type="text" id="reg-username" placeholder="الاسم المستعار (مثلاً: LUFFY)">
            <button onclick="handleRegister()" style="background: #28a745; color: white;">تأكيد التسجيل</button>
            <p style="font-size: 0.8rem; margin-top: 15px;"><a href="javascript:void(0)" onclick="showPage('login')" style="color: var(--gold-main);">العودة لتسجيل الدخول</a></p>
        </div>

        <p id="error-msg" style="color: #ff4444; font-size: 0.8rem; margin-top: 10px; font-weight: bold;"></p>
    </div>
</div>

<header>
    <div style="font-size: 1.5rem; font-weight: 900; color: var(--gold-main);">GAME ZONE <span style="color: white;">CHAT</span></div>
    <div id="user-badge"></div>
</header>

<div id="chat-container"></div>

<div class="input-box">
    <input type="text" id="msg-input" placeholder="اكتب رسالة..." onkeypress="if(event.key==='Enter') sendMessage()">
    <button onclick="sendMessage()" style="width: auto;">إرسال</button>
</div>

<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>

<script>
    const firebaseConfig = {
        apiKey: "AIzaSyBqu1IE24FhA-govU_swQ4IcynOj4AB-ao",
        authDomain: "game-zone-chat1.firebaseapp.com",
        projectId: "game-zone-chat1",
        storageBucket: "game-zone-chat1.firebasestorage.app",
        messagingSenderId: "932733239188",
        appId: "1:932733239188:web:634fbfc00a396c761a1981"
    };
    
    firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();
    const auth = firebase.auth();
    let myProfile = null;
    let amIMuted = false;

    const FOUNDER_EMAIL = "abdarahman10555@gmail.com";

    // التنقل بين الصفحات
    function showPage(page) {
        document.getElementById('login-form').style.display = page === 'login' ? 'block' : 'none';
        document.getElementById('reg-form').style.display = page === 'reg' ? 'block' : 'none';
        document.getElementById('error-msg').innerText = "";
    }

    // وظيفة تسجيل الدخول
    async function handleLogin() {
        const email = document.getElementById('email').value.trim();
        const pass = document.getElementById('password').value;
        try {
            const cred = await auth.signInWithEmailAndPassword(email, pass);
            loadChat(cred.user.uid);
        } catch (e) { 
            document.getElementById('error-msg').innerText = "خطأ: البيانات غير صحيحة.";
        }
    }

    // وظيفة إنشاء حساب جديد مع التنبيه (6 حروف)
    async function handleRegister() {
        const email = document.getElementById('reg-email').value.trim();
        const pass = document.getElementById('reg-password').value;
        const name = document.getElementById('reg-username').value.trim();
        const err = document.getElementById('error-msg');

        if (pass.length < 6) { 
            err.innerText = "تنبيه: يجب أن تكون كلمة السر 6 أحرف أو أكثر.";
            return; 
        }
        if (!name) { err.innerText = "يرجى كتابة الاسم المستعار."; return; }

        try {
            const cred = await auth.createUserWithEmailAndPassword(email, pass);
            await db.collection('users').doc(cred.user.uid).set({
                uid: cred.user.uid,
                email: email,
                name: name,
                isMuted: false
            });
            loadChat(cred.user.uid);
        } catch (e) { err.innerText = "خطأ: " + e.message; }
    }

    async function loadChat(uid) {
        const doc = await db.collection('users').doc(uid).get();
        myProfile = doc.data();
        document.getElementById('login-screen').style.display = 'none';
        const isF = (auth.currentUser.email === FOUNDER_EMAIL);
        document.getElementById('user-badge').innerHTML = `<span class="${isF ? 'rank-founder' : ''}">${isF ? 'المؤسس ⚡' : 'عضو'} | ${myProfile.name}</span>`;
        listenToMessages();
        db.collection('users').doc(uid).onSnapshot(d => { amIMuted = d.data().isMuted || false; });
    }

    // بقية وظائف الشات الأصلية (Send, Listen, etc.)
    async function sendMessage() {
        const input = document.getElementById('msg-input');
        if (!input.value.trim() || amIMuted) return;
        await db.collection('messages').add({
            uid: auth.currentUser.uid,
            email: auth.currentUser.email,
            name: myProfile.name,
            text: input.value,
            createdAt: firebase.firestore.FieldValue.serverTimestamp()
        });
        input.value = "";
    }

    function listenToMessages() {
        db.collection('messages').orderBy('createdAt', 'asc').limitToLast(50).onSnapshot(snap => {
            const container = document.getElementById('chat-container');
            container.innerHTML = "";
            snap.forEach(doc => {
                const m = doc.data();
                const userIsFounder = (m.email === FOUNDER_EMAIL);
                const div = document.createElement('div');
                div.className = `message ${userIsFounder ? 'msg-founder' : ''}`;
                div.innerHTML = `<div class="msg-info"><span class="${userIsFounder ? 'rank-founder' : ''}">${m.name}</span> <span style="color:#666; font-size:0.7rem;">[${userIsFounder ? 'المؤسس ⚡' : 'عضو'}]</span></div><div style="color: white; word-break: break-word;">${m.text}</div>`;
                container.appendChild(div);
            });
            container.scrollTop = container.scrollHeight;
        });
    }
</script>
</body>
</html>
