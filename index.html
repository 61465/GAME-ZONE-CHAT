<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Game Zone Chat | VIP Gold</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-black: #050505;
            --gold-main: #D4AF37; /* اللون الذهبي الملكي */
            --gold-glow: #FFD700;
            --dark-card: #121212;
            --text-white: #ffffff;
        }

        body {
            font-family: 'Cairo', sans-serif;
            background-color: var(--bg-black);
            color: var(--text-white);
            margin: 0;
            display: flex;
            flex-direction: column;
            height: 100vh;
            overflow: hidden;
        }

        /* شاشة الدخول */
        #login-screen {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.95);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }
        .login-box {
            background: var(--dark-card);
            padding: 40px;
            border-radius: 15px;
            border: 2px solid var(--gold-main);
            text-align: center;
            box-shadow: 0 0 30px rgba(212, 175, 55, 0.2);
        }

        /* الهيدر */
        header {
            background: var(--dark-card);
            padding: 15px 25px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 2px solid var(--gold-main);
        }

        #chat-container {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 15px;
            background-image: radial-gradient(circle at center, #1a1a1a 0%, #050505 100%);
        }

        /* تصميم الرسائل */
        .message {
            background: #1a1a1a;
            padding: 12px 18px;
            border-radius: 12px;
            max-width: 80%;
            align-self: flex-start;
            border: 1px solid #333;
            border-right: 4px solid var(--gold-main);
        }
        .msg-info {
            font-size: 0.8rem;
            margin-bottom: 5px;
            display: flex;
            gap: 10px;
            font-weight: bold;
            color: var(--gold-main);
        }

        /* الرتب */
        .rank-legend { color: var(--gold-glow); text-shadow: 0 0 10px var(--gold-main); animation: goldPulse 1.5s infinite alternate; }
        @keyframes goldPulse { from { opacity: 0.8; } to { opacity: 1; text-shadow: 0 0 20px var(--gold-glow); } }

        /* منطقة الإدخال */
        .input-box {
            background: var(--dark-card);
            padding: 20px;
            display: flex;
            gap: 10px;
            border-top: 2px solid var(--gold-main);
        }
        input {
            flex: 1;
            background: #000;
            border: 1px solid var(--gold-main);
            padding: 12px;
            border-radius: 8px;
            color: gold;
            outline: none;
        }
        button {
            background: var(--gold-main);
            color: black;
            border: none;
            padding: 0 25px;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s;
        }
        button:hover { background: var(--gold-glow); transform: scale(1.05); }
    </style>
</head>
<body>

<div id="login-screen">
    <div class="login-box">
        <h1 style="color: var(--gold-main); font-weight: 900;">GAME ZONE VIP</h1>
        <p style="color: #aaa;">أهلاً بك في مجلس الأساطير الذهبي</p>
        <input type="text" id="username" placeholder="اكتب اسمك هنا..." style="width: 85%; margin-bottom: 20px;">
        <br>
        <button onclick="joinChat()">دخول المجلس</button>
    </div>
</div>

<header>
    <div style="font-size: 1.5rem; font-weight: 900; color: var(--gold-main);">GAME ZONE <span style="color: white;">CHAT</span></div>
    <div id="user-badge" style="color: var(--gold-main); font-weight: bold;">جاري التحميل...</div>
</header>

<div id="chat-container"></div>

<div class="input-box">
    <input type="text" id="msg-input" placeholder="اكتب رسالة ذهبية...">
    <button onclick="sendMessage()">إرسال</button>
</div>

<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>

<script>
    // بياناتك الخاصة من مشروعك
    const firebaseConfig = {
        apiKey: "AIzaSyBqu1IE24FhA-govU_swQ4IcynOj4AB-ao",
        authDomain: "game-zone-chat1.firebaseapp.com",
        projectId: "game-zone-chat1",
        storageBucket: "game-zone-chat1.firebasestorage.app",
        messagingSenderId: "932733239188",
        appId: "1:932733239188:web:634fbfc00a396c761a1981"
    };
    
    firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();
    let myProfile = null;

    // دالة الرتب بناءً على الولاء
    function getRank(joinDate, lastActive) {
        const now = Date.now();
        const daysRegistered = (now - joinDate) / (1000 * 60 * 60 * 24);
        const daysSinceLastActive = (now - lastActive) / (1000 * 60 * 60 * 24);

        if (daysSinceLastActive > 5) return { name: "منقطع 😴", class: "rank-new" };
        if (daysRegistered >= 90) return { name: "أسطورة GZ 👑", class: "rank-legend" };
        if (daysRegistered >= 30) return { name: "عضو ملكي 🥇", class: "rank-royal" };
        return { name: "لاعب جديد 🥚", class: "rank-new" };
    }

    async function joinChat() {
        const name = document.getElementById('username').value;
        if (!name) return alert("الرجاء إدخال اسمك!");

        try {
            const userCred = await firebase.auth().signInAnonymously();
            const uid = userCred.user.uid;
            const userRef = db.collection('users').doc(uid);
            const doc = await userRef.get();

            // حل مشكلة doc.exists is not a function بناءً على صورتك
            if (!doc.exists) { 
                myProfile = { uid, name, joinDate: Date.now(), lastActive: Date.now() };
                await userRef.set(myProfile);
            } else {
                myProfile = doc.data();
                myProfile.lastActive = Date.now();
                await userRef.update({ lastActive: Date.now() });
            }

            document.getElementById('login-screen').style.display = 'none';
            displayBadge();
            listenToMessages();
        } catch (e) {
            console.error(e);
            alert("خطأ: تأكد من تفعيل Anonymous Auth وتوفير الإنترنت.");
        }
    }

    function displayBadge() {
        const rank = getRank(myProfile.joinDate, myProfile.lastActive);
        document.getElementById('user-badge').innerHTML = `<span class="${rank.class}">${rank.name} | ${myProfile.name}</span>`;
    }

    async function sendMessage() {
        const input = document.getElementById('msg-input');
        if (!input.value) return;

        const currentRank = getRank(myProfile.joinDate, Date.now());

        await db.collection('messages').add({
            name: myProfile.name,
            text: input.value,
            rankName: currentRank.name,
            rankClass: currentRank.class,
            createdAt: firebase.firestore.FieldValue.serverTimestamp()
        });

        input.value = "";
    }

    function listenToMessages() {
        db.collection('messages').orderBy('createdAt', 'asc').limitToLast(50)
            .onSnapshot(snap => {
                const container = document.getElementById('chat-container');
                container.innerHTML = "";
                snap.forEach(doc => {
                    const m = doc.data();
                    const div = document.createElement('div');
                    div.className = 'message';
                    div.innerHTML = `
                        <div class="msg-info">
                            <span class="${m.rankClass}">${m.name}</span>
                            <span style="color: #666;">[${m.rankName}]</span>
                        </div>
                        <div style="color: white;">${m.text}</div>
                    `;
                    container.appendChild(div);
                });
                container.scrollTop = container.scrollHeight;
            });
    }
</script>
</body>
</html>
