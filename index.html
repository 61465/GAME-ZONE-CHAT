<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>GAME ZONE | لوحة التحكم</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap');
        :root { --gold: #D4AF37; --dark-bg: #050505; --panel-bg: #0a0a0a; --founder-red: #ff3e3e; }
        * { margin: 0; padding: 0; box-sizing: border-box; outline: none; }
        body { background: var(--dark-bg); color: #e0e0e0; font-family: 'Cairo', sans-serif; height: 100vh; overflow: hidden; display: flex; }
        
        /* شاشة الدخول */
        #login-overlay { position: fixed; inset: 0; background: var(--dark-bg); z-index: 10000; display: flex; justify-content: center; align-items: center; }
        .login-box { width: 320px; padding: 30px; background: var(--panel-bg); border: 2px solid var(--gold); border-radius: 15px; text-align: center; }

        /* الهيكل الرئيسي */
        .main-wrapper { display: none; width: 100%; height: 100vh; }
        
        /* قائمة الأعضاء (للمؤسس فقط) */
        .members-sidebar { width: 280px; background: #000; border-left: 2px solid var(--gold); display: none; flex-direction: column; }
        .sidebar-header { padding: 20px; border-bottom: 1px solid #222; color: var(--gold); text-align: center; font-weight: 900; }
        .member-item { padding: 15px; border-bottom: 1px solid #111; display: flex; flex-direction: column; gap: 8px; }
        .member-name { font-size: 0.8rem; color: #fff; overflow: hidden; text-overflow: ellipsis; }
        .member-actions { display: flex; gap: 5px; }
        .btn-action { flex: 1; padding: 5px; border: none; border-radius: 4px; cursor: pointer; font-size: 0.7rem; font-family: 'Cairo'; font-weight: bold; }
        .btn-mute { background: #ff9800; color: #000; }
        .btn-ban { background: #f44336; color: #fff; }

        /* منطقة الشات */
        .chat-section { flex: 1; display: flex; flex-direction: column; background: var(--panel-bg); }
        .chat-header { background: #000; padding: 15px; border-bottom: 2px solid var(--gold); display: flex; justify-content: space-between; align-items: center; }
        .messages-container { flex: 1; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; gap: 12px; }
        
        /* الرسائل */
        .message { max-width: 80%; padding: 10px 15px; border-radius: 15px; background: rgba(255,255,255,0.05); border: 1px solid #222; }
        .message.me { align-self: flex-end; border-left: 3px solid #555; }
        .message.user { align-self: flex-start; border-right: 3px solid var(--gold); }
        .msg-founder { border: 1px solid var(--gold) !important; background: rgba(212, 175, 55, 0.1) !important; }
        .founder-tag { background: var(--founder-red); color: white; font-size: 9px; padding: 2px 5px; border-radius: 3px; margin-left: 5px; }

        /* الإدخال */
        .input-area { padding: 15px; background: #000; border-top: 1px solid #222; }
        .input-wrapper { display: flex; gap: 10px; }
        #messageInput { flex: 1; background: #111; border: 1px solid #333; color: white; padding: 12px 20px; border-radius: 25px; }
        #messageInput:disabled { background: #2a1010; color: #ff8888; }
        .send-btn { background: var(--gold); border: none; width: 45px; height: 45px; border-radius: 50%; cursor: pointer; }
    </style>
</head>
<body>

<div id="login-overlay">
    <div class="login-box">
        <h2 style="color: var(--gold); margin-bottom: 20px;">GAME ZONE CHAT</h2>
        <input type="email" id="email" placeholder="البريد الإلكتروني" style="width:100%; padding:12px; margin-bottom:10px; background:#000; border:1px solid #333; color:white; border-radius: 8px;">
        <input type="password" id="pass" placeholder="كلمة السر" style="width:100%; padding:12px; margin-bottom:20px; background:#000; border:1px solid #333; color:white; border-radius: 8px;">
        <button onclick="authSystem()" style="width:100%; padding:12px; background:var(--gold); border:none; font-weight:bold; cursor:pointer; border-radius: 8px;">دخول</button>
    </div>
</div>

<div class="main-wrapper" id="app">
    <aside class="members-sidebar" id="founderSidebar">
        <div class="sidebar-header">لوحة التحكم بالأعضاء</div>
        <div id="membersList" style="overflow-y: auto; flex: 1;"></div>
        <button onclick="clearZone()" style="background: red; color: white; border: none; padding: 10px; cursor: pointer; font-weight: bold;">تطهير الشات</button>
    </aside>

    <section class="chat-section">
        <header class="chat-header">
            <h2 style="color: var(--gold); font-size: 1.2rem;">GAME ZONE</h2>
            <div id="userNameDisplay" style="font-size: 0.8rem;"></div>
        </header>
        <main class="messages-container" id="msgBox"></main>
        <footer class="input-area">
            <div class="input-wrapper">
                <input type="text" id="messageInput" placeholder="اكتب هنا...">
                <button class="send-btn" onclick="sendMessage()"><i class="fas fa-paper-plane"></i></button>
            </div>
        </footer>
    </section>
</div>

<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>

<script>
const FOUNDER_ID = "abdarahman10555@gmail.com";
const firebaseConfig = {
    apiKey: "AIzaSyBqu1IE24FhA-govU_swQ4IcynOj4AB-ao",
    authDomain: "game-zone-chat1.firebaseapp.com",
    projectId: "game-zone-chat1",
    storageBucket: "game-zone-chat1.firebasestorage.app",
    messagingSenderId: "932733239188",
    appId: "1:932733239188:web:634fbfc00a396c761a1981"
};

firebase.initializeApp(firebaseConfig);
const db = firebase.firestore();
const auth = firebase.auth();

async function authSystem() {
    const e = document.getElementById('email').value;
    const p = document.getElementById('pass').value;
    try { await auth.signInWithEmailAndPassword(e, p); } 
    catch { await auth.createUserWithEmailAndPassword(e, p); }
}

auth.onAuthStateChanged(async (user) => {
    if(user) {
        // فحص البان (Ban) أولاً
        const banCheck = await db.collection('bans').doc(user.email).get();
        if(banCheck.exists) {
            alert("لقد تم حظرك نهائياً من دخول GAME ZONE");
            auth.signOut();
            location.reload();
            return;
        }

        // تسجيل المستخدم في قاعدة البيانات ليظهر عند المؤسس
        await db.collection('users').doc(user.email).set({
            email: user.email,
            name: user.email.split('@')[0],
            lastSeen: firebase.firestore.FieldValue.serverTimestamp()
        });

        document.getElementById('login-overlay').style.display = 'none';
        document.getElementById('app').style.display = 'flex';
        document.getElementById('userNameDisplay').innerText = user.email;

        if(user.email === FOUNDER_ID) {
            document.getElementById('founderSidebar').style.display = 'flex';
            loadMembersList();
        }
        
        // مستمع الميوت
        db.collection('mutes').doc(user.email).onSnapshot(doc => {
            const input = document.getElementById('messageInput');
            input.disabled = doc.exists;
            input.placeholder = doc.exists ? "تم كتمك!" : "اكتب هنا...";
        });

        listenMessages();
    }
});

// جلب قائمة الأعضاء للمؤسس
function loadMembersList() {
    db.collection('users').onSnapshot(snap => {
        const list = document.getElementById('membersList');
        list.innerHTML = "";
        snap.forEach(doc => {
            const userData = doc.data();
            if(userData.email === FOUNDER_ID) return;

            const div = document.createElement('div');
            div.className = "member-item";
            div.innerHTML = `
                <div class="member-name">${userData.email}</div>
                <div class="member-actions">
                    <button class="btn-action btn-mute" onclick="toggleMute('${userData.email}')">ميوت/فك</button>
                    <button class="btn-action btn-ban" onclick="setBan('${userData.email}')">بان (طرد)</button>
                </div>
            `;
            list.appendChild(div);
        });
    });
}

async function sendMessage() {
    const inp = document.getElementById('messageInput');
    if(!inp.value.trim() || inp.disabled) return;
    await db.collection('messages').add({
        text: inp.value,
        sender: auth.currentUser.email,
        name: auth.currentUser.email.split('@')[0],
        time: firebase.firestore.FieldValue.serverTimestamp()
    });
    inp.value = "";
}

function listenMessages() {
    db.collection('messages').onSnapshot(snap => {
        const box = document.getElementById('msgBox');
        let msgs = [];
        snap.forEach(doc => msgs.push({id: doc.id, ...doc.data()}));
        msgs.sort((a, b) => (a.time?.seconds || 0) - (b.time?.seconds || 0));
        box.innerHTML = "";
        msgs.forEach(m => {
            const isFounder = m.sender === FOUNDER_ID;
            const isMe = m.sender === auth.currentUser.email;
            const div = document.createElement('div');
            div.className = `message ${isMe ? 'me' : 'user'} ${isFounder ? 'msg-founder' : ''}`;
            div.innerHTML = `
                <div style="font-size:0.7rem; color:var(--gold); margin-bottom:5px;">
                    ${isFounder ? '<span class="founder-tag">FOUNDER</span>' : ''} ${m.name}
                </div>
                <div>${m.text}</div>
            `;
            box.appendChild(div);
        });
        box.scrollTop = box.scrollHeight;
    });
}

// وظائف المؤسس
async function toggleMute(email) {
    const ref = db.collection('mutes').doc(email);
    const d = await ref.get();
    d.exists ? await ref.delete() : await ref.set({muted: true});
}

async function setBan(email) {
    if(confirm("هل تريد طرد هذا الشخص نهائياً؟")) {
        await db.collection('bans').doc(email).set({banned: true});
        alert("تم الحظر");
    }
}

async function clearZone() {
    if(confirm("مسح الشات بالكامل؟")) {
        const snap = await db.collection('messages').get();
        snap.forEach(d => d.ref.delete());
    }
}

document.getElementById('messageInput').addEventListener('keypress', (e) => { if(e.key === 'Enter') sendMessage(); });
</script>
</body>
</html>
