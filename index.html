<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>GAME ZONE | OS v2.0</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Cairo:wght@400;700&display=swap');
        :root { --win-bg: #008080; --gray: #c0c0c0; --win-blue: #000080; }
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Cairo', sans-serif; }
        body { background: var(--win-bg); height: 100vh; display: flex; flex-direction: column; overflow: hidden; }

        /* نوافذ ويندوز كلاسيك */
        .win-window { background: var(--gray); border: 2px solid #fff; border-right-color: #000; border-bottom-color: #000; padding: 3px; box-shadow: 2px 2px 10px rgba(0,0,0,0.5); }
        .win-title { background: var(--win-blue); color: white; padding: 4px 8px; font-weight: bold; font-size: 0.85rem; display: flex; justify-content: space-between; }
        .win-body { padding: 15px; }

        /* الشات */
        #main-app { display: none; flex-direction: column; height: 100vh; }
        .msg-area { flex: 1; background: #fff; border: 2px solid #000; border-right-color: #fff; border-bottom-color: #fff; overflow-y: auto; padding: 10px; display: flex; flex-direction: column; gap: 5px; }
        
        /* الرسائل */
        .msg-row { margin-bottom: 8px; max-width: 90%; }
        .nickname { font-size: 0.8rem; font-weight: bold; cursor: pointer; display: block; margin-bottom: 2px; }
        .bubble { padding: 8px; background: #eee; border: 1px solid #999; font-size: 0.9rem; word-break: break-all; display: inline-block; }
        .me .bubble { background: #e2f0ff; border-color: #7aa3cc; }
        .me { align-self: flex-end; text-align: left; }

        /* شريط المهام السفلي */
        .taskbar { background: var(--gray); border-top: 2px solid #fff; padding: 5px; display: flex; gap: 5px; }
        input { flex: 1; padding: 8px; border: 2px solid #000; border-right-color: #fff; border-bottom-color: #fff; }
        button { padding: 5px 15px; background: var(--gray); border: 2px solid #fff; border-right-color: #000; border-bottom-color: #000; cursor: pointer; font-weight: bold; }

        /* الرتب */
        .rank-badge { font-size: 0.65rem; padding: 1px 4px; border-radius: 3px; margin-right: 5px; color: white; vertical-align: middle; }
        .rank-legend { background: #ff00ff; } /* أسطورة */
        .rank-trusted { background: #008000; } /* موثوق */
        .rank-active { background: #0000ff; } /* نشط */
        .rank-new { background: #808080; } /* جديد */
        .rank-founder { background: #ff0000; font-weight: 900; } /* مؤسس */

        #auth-screen { position: fixed; inset: 0; background: var(--win-bg); z-index: 1000; display: flex; justify-content: center; align-items: center; }
    </style>
</head>
<body>

<div id="auth-screen">
    <div class="win-window" id="login-form">
        <div class="win-title"><span>System_Login.exe</span></div>
        <div class="win-body">
            <input type="email" id="email" placeholder="البريد الإلكتروني" style="width: 100%; margin-bottom: 10px;">
            <input type="password" id="pass" placeholder="كلمة السر" style="width: 100%; margin-bottom: 10px;">
            <button onclick="authSystem()">دخول</button>
        </div>
    </div>

    <div class="win-window" id="nick-form" style="display: none; width: 300px;">
        <div class="win-title"><span>Profile_Setup.exe</span></div>
        <div class="win-body">
            <p style="font-size: 0.8rem; margin-bottom: 10px;">أهلاً بك! اختر اسمك المستعار:</p>
            <input type="text" id="nicknameInput" placeholder="الاسم المستعار...">
            <button onclick="saveProfile()">حفظ والبدء</button>
        </div>
    </div>
</div>

<div id="main-app">
    <div class="win-window" style="flex:1; margin: 10px; display:flex; flex-direction:column;">
        <div class="win-title"><span><i class="fas fa-terminal"></i> GAME_ZONE_MAIN_FRAME</span></div>
        <div class="msg-area" id="msgBox"></div>
    </div>
    <div class="taskbar">
        <input type="text" id="messageInput" placeholder="اكتب رسالة...">
        <button onclick="sendMessage()">إرسال</button>
    </div>
</div>

<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>

<script>
const FOUNDER_ID = "abdarahman10555@gmail.com";
const firebaseConfig = {
    apiKey: "AIzaSyBqu1IE24FhA-govU_swQ4IcynOj4AB-ao",
    authDomain: "game-zone-chat1.firebaseapp.com",
    projectId: "game-zone-chat1",
    storageBucket: "game-zone-chat1.firebasestorage.app",
    messagingSenderId: "932733239188",
    appId: "1:932733239188:web:634fbfc00a396c761a1981"
};

firebase.initializeApp(firebaseConfig);
const db = firebase.firestore();
const auth = firebase.auth();

// دالة لحساب الرتبة بناءً على تاريخ الانضمام
function calculateRank(joinDate, email) {
    if (email === FOUNDER_ID) return { name: "مؤسس", class: "rank-founder" };
    
    const now = new Date();
    const joined = joinDate.toDate();
    const diffDays = Math.floor((now - joined) / (1000 * 60 * 60 * 24));

    if (diffDays >= 30) return { name: "أسطورة", class: "rank-legend" };
    if (diffDays >= 7) return { name: "موثوق", class: "rank-trusted" };
    if (diffDays >= 3) return { name: "عضو نشط", class: "rank-active" };
    return { name: "عضو جديد", class: "rank-new" };
}

async function authSystem() {
    const e = document.getElementById('email').value;
    const p = document.getElementById('pass').value;
    try { await auth.signInWithEmailAndPassword(e, p); } 
    catch { await auth.createUserWithEmailAndPassword(e, p); }
}

auth.onAuthStateChanged(async user => {
    if(user) {
        document.getElementById('login-form').style.display = 'none';
        const userDoc = await db.collection('users').doc(user.email).get();
        if(!userDoc.exists) {
            document.getElementById('nick-form').style.display = 'block';
        } else {
            enterApp();
        }
    }
});

async function saveProfile() {
    const nick = document.getElementById('nicknameInput').value;
    if(!nick) return;
    await db.collection('users').doc(auth.currentUser.email).set({
        nickname: nick,
        joinDate: firebase.firestore.FieldValue.serverTimestamp(),
        email: auth.currentUser.email
    });
    enterApp();
}

function enterApp() {
    document.getElementById('auth-screen').style.display = 'none';
    document.getElementById('main-app').style.display = 'flex';
    listenMessages();
}

async function sendMessage() {
    const inp = document.getElementById('messageInput');
    if(!inp.value.trim()) return;
    const userSnap = await db.collection('users').doc(auth.currentUser.email).get();
    const userData = userSnap.data();
    
    await db.collection('messages').add({
        text: inp.value,
        sender: auth.currentUser.email,
        nickname: userData.nickname,
        joinDate: userData.joinDate,
        time: firebase.firestore.FieldValue.serverTimestamp()
    });
    inp.value = "";
}

function listenMessages() {
    db.collection('messages').orderBy('time').onSnapshot(snap => {
        const box = document.getElementById('msgBox');
        box.innerHTML = "";
        snap.forEach(doc => {
            const m = doc.data();
            const isMe = m.sender === auth.currentUser.email;
            const rank = calculateRank(m.joinDate, m.sender);
            
            const div = document.createElement('div');
            div.className = `msg-row ${isMe ? 'me' : ''}`;
            div.innerHTML = `
                <span class="nickname" onclick="alert('الاسم: ${m.nickname}\\nالرتبة: ${rank.name}')">
                    <span class="rank-badge ${rank.class}">${rank.name}</span> ${m.nickname}
                </span>
                <div class="bubble">${m.text}</div>
            `;
            box.appendChild(div);
        });
        box.scrollTop = box.scrollHeight;
    });
}

document.getElementById('messageInput').addEventListener('keypress', e => { if(e.key==='Enter') sendMessage(); });
</script>
</body>
</html>
