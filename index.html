<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Game Zone Ultimate | المؤسس</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;700;900&display=swap" rel="stylesheet">
    <style>
        /* ==========================================
           1. نظام الألوان والأساسيات (الاحترافية)
           ========================================== */
        :root { 
            --bg-black: #050505; 
            --gold-main: #D4AF37; 
            --gold-dark: #aa8c2c;
            --dark-card: #121212; 
            --founder-red: #ff3333;
            --text-gray: #b3b3b3;
            --glass: rgba(255, 255, 255, 0.03);
        }

        * { 
            box-sizing: border-box; 
            margin: 0; padding: 0;
            -webkit-tap-highlight-color: transparent; 
        }

        html, body {
            height: 100%;
            width: 100%;
            overflow: hidden; /* لمنع اهتزاز الصفحة الخارجية */
            background-color: var(--bg-black);
            font-family: 'Cairo', sans-serif;
            color: white;
            display: flex;
            flex-direction: column; /* تقسيم الصفحة رأسياً */
        }

        /* ==========================================
           2. الهيدر (Header) - ثابت في الأعلى
           ========================================== */
        header { 
            height: 75px;
            background: linear-gradient(to bottom, #111, #050505);
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
            padding: 0 25px;
            border-bottom: 2px solid var(--gold-main);
            z-index: 2000;
            box-shadow: 0 4px 30px rgba(0,0,0,0.9);
            flex-shrink: 0;
        }

        .logo-area { display: flex; flex-direction: column; }
        .logo-main { font-weight: 900; color: var(--gold-main); font-size: 1.4rem; letter-spacing: 1px; }
        .logo-sub { font-size: 0.6rem; color: var(--text-gray); text-transform: uppercase; }

        /* ==========================================
           3. منطقة الشات (التي تحتوي على السكرول)
           ========================================== */
        #chat-container { 
            flex: 1; /* تأخذ كل مساحة الشاشة الوسطى */
            overflow-y: scroll; /* تمكين التمرير */
            overflow-x: hidden;
            padding: 25px 15px;
            display: flex;
            flex-direction: column;
            gap: 18px;
            background: 
                radial-gradient(circle at top, #151515 0%, #050505 100%),
                url('https://www.transparenttextures.com/patterns/carbon-fibre.png');
            -webkit-overflow-scrolling: touch; /* سلاسة فائقة للايفون */
        }

        /* تنسيق شريط التمرير الذهبي */
        #chat-container::-webkit-scrollbar { width: 5px; }
        #chat-container::-webkit-scrollbar-track { background: transparent; }
        #chat-container::-webkit-scrollbar-thumb { 
            background: linear-gradient(var(--gold-main), var(--gold-dark)); 
            border-radius: 10px; 
        }

        /* ==========================================
           4. تصميم الرسائل (Message Bubbles)
           ========================================== */
        .message-row {
            display: flex;
            width: 100%;
            flex-direction: column;
        }

        .message { 
            background: var(--glass); 
            padding: 14px 18px; 
            border-radius: 18px 18px 0 18px; 
            max-width: 88%; 
            border-right: 3px solid var(--gold-main);
            position: relative;
            backdrop-filter: blur(5px);
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
            animation: slideIn 0.3s ease-out;
            align-self: flex-start;
        }

        .my-message {
            align-self: flex-end;
            border-radius: 18px 18px 18px 0;
            border-right: none;
            border-left: 3px solid var(--gold-main);
            background: rgba(212, 175, 55, 0.05);
        }

        @keyframes slideIn { 
            from { opacity: 0; transform: translateY(15px); } 
            to { opacity: 1; transform: translateY(0); } 
        }

        .msg-founder { 
            border: 1px solid rgba(212, 175, 55, 0.2);
            border-right: 5px solid var(--founder-red);
            background: rgba(255, 0, 0, 0.03);
        }

        .user-info {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 6px;
        }

        .username { 
            font-weight: 800; 
            color: var(--gold-main); 
            font-size: 0.8rem; 
            cursor: pointer;
            transition: 0.3s;
        }
        .username:hover { color: white; text-shadow: 0 0 10px var(--gold-main); }

        .reply-btn { font-size: 0.65rem; color: var(--text-gray); cursor: pointer; padding: 2px 8px; background: rgba(255,255,255,0.05); border-radius: 10px; }

        .reply-content {
            background: rgba(0,0,0,0.4);
            padding: 6px 12px;
            border-radius: 10px;
            margin-bottom: 10px;
            border-right: 2px solid #444;
            font-size: 0.75rem;
            color: #999;
        }

        /* ==========================================
           5. الفوتر وصندوق الكتابة (Fixed Footer)
           ========================================== */
        .footer-area {
            flex-shrink: 0;
            background: var(--dark-card);
            border-top: 1px solid rgba(212, 175, 55, 0.2);
            z-index: 2000;
            padding-bottom: env(safe-area-inset-bottom);
        }

        #reply-preview {
            display: none;
            background: #1a1a1a;
            padding: 10px 20px;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #333;
        }

        .input-container {
            display: flex;
            padding: 15px 20px;
            gap: 12px;
            align-items: center;
        }

        #user-msg {
            flex: 1;
            background: #000;
            border: 1px solid #333;
            padding: 14px 20px;
            border-radius: 30px;
            color: white;
            font-size: 16px;
            outline: none;
            transition: 0.3s;
        }
        #user-msg:focus { border-color: var(--gold-main); box-shadow: 0 0 15px rgba(212, 175, 55, 0.1); }

        .send-btn {
            background: linear-gradient(135deg, var(--gold-main), var(--gold-dark));
            width: 50px; height: 50px;
            border-radius: 50%;
            border: none;
            display: flex; align-items: center; justify-content: center;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(0,0,0,0.4);
            transition: 0.3s;
        }
        .send-btn:active { transform: scale(0.9); }

        /* ==========================================
           6. لوحة تحكم المؤسس (Admin Panel)
           ========================================== */
        #admin-panel {
            position: fixed;
            background: rgba(20, 20, 20, 0.98);
            border: 1px solid var(--gold-main);
            border-radius: 20px;
            padding: 15px;
            display: none;
            z-index: 9999;
            width: 220px;
            box-shadow: 0 20px 50px rgba(0,0,0,0.8);
            backdrop-filter: blur(10px);
        }

        .admin-option {
            width: 100%;
            padding: 12px;
            margin: 5px 0;
            background: rgba(255,255,255,0.03);
            color: white;
            border: 1px solid #333;
            border-radius: 12px;
            cursor: pointer;
            text-align: right;
            font-family: 'Cairo';
            font-weight: bold;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .admin-option:hover { background: rgba(212, 175, 55, 0.1); border-color: var(--gold-main); }
        .opt-delete { color: var(--founder-red); border-color: rgba(255, 0, 0, 0.2); }

        /* شاشات النظام */
        #loading-screen {
            position: fixed; inset: 0; background: #000; z-index: 10000;
            display: flex; flex-direction: column; justify-content: center; align-items: center;
        }
        .loader { border: 4px solid #111; border-top: 4px solid var(--gold-main); border-radius: 50%; width: 40px; height: 40px; animation: spin 1s linear infinite; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

        #alert-popup {
            position: fixed; bottom: 100px; left: 50%; transform: translateX(-50%);
            background: var(--gold-main); color: black; padding: 10px 30px;
            border-radius: 50px; font-weight: 900; z-index: 10001; display: none;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }
    </style>
</head>
<body>

<div id="loading-screen">
    <div class="loader"></div>
    <p style="margin-top:20px; color:var(--gold-main); font-weight:900; letter-spacing:2px;">جاري تأمين الاتصال...</p>
</div>

<div id="alert-popup"></div>

<div id="admin-panel">
    <p id="target-name" style="text-align:center; color:var(--gold-main); margin-bottom:10px; font-weight:900; border-bottom:1px solid #333; padding-bottom:10px;"></p>
    <button class="admin-option" onclick="execAdmin('mute')">🔇 كتم العضو</button>
    <button class="admin-option" onclick="execAdmin('unmute')">🔊 فك الكتم</button>
    <button class="admin-option opt-delete" id="founder-delete-btn" style="display:none;" onclick="execAdmin('delete')">🗑️ حذف الرسالة نهائياً</button>
    <button onclick="closeAdmin()" style="width:100%; background:none; border:none; color:#555; margin-top:10px; cursor:pointer;">إغلاق القائمة</button>
</div>

<header>
    <div class="logo-area">
        <span class="logo-main">GAME ZONE</span>
        <span class="logo-sub">Ultimate Founder Edition</span>
    </div>
    <div id="rank-badge"></div>
</header>

<div id="chat-container"></div>

<div class="footer-area">
    <div id="reply-preview">
        <div id="reply-info" style="font-size: 0.75rem; color: #888;"></div>
        <div onclick="cancelReply()" style="color: var(--founder-red); font-weight: bold; cursor: pointer;">✕</div>
    </div>
    <div class="input-container">
        <input type="text" id="user-msg" placeholder="اكتب رسالتك الملكية..." autocomplete="off">
        <button class="send-btn" onclick="sendMessage()">
            <svg viewBox="0 0 24 24" width="24" height="24" fill="black"><path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"></path></svg>
        </button>
    </div>
</div>

<div id="login-overlay" style="position:fixed; inset:0; background:#000; z-index:9000; display:none; justify-content:center; align-items:center;">
    <div style="background:var(--dark-card); padding:40px; border-radius:25px; border:1px solid var(--gold-main); width:90%; max-width:380px; text-align:center;">
        <h2 style="color:var(--gold-main); margin-bottom:30px; font-weight:900;">تسجيل الدخول</h2>
        <input type="email" id="login-email" placeholder="البريد الإلكتروني" style="width:100%; padding:15px; margin-bottom:15px; border-radius:12px; border:1px solid #333; background:#000; color:#fff; outline:none;">
        <input type="password" id="login-pass" placeholder="كلمة السر" style="width:100%; padding:15px; margin-bottom:25px; border-radius:12px; border:1px solid #333; background:#000; color:#fff; outline:none;">
        <button onclick="handleLogin()" style="width:100%; padding:15px; background:var(--gold-main); border:none; border-radius:12px; font-weight:900; cursor:pointer; font-size:1.1rem;">دخول</button>
    </div>
</div>

<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>

<script>
// ==========================================
// 1. الإعدادات المتقدمة
// ==========================================
const FOUNDER_EMAIL = "abdarahman10555@gmail.com";
const firebaseConfig = {
    apiKey: "AIzaSyBqu1IE24FhA-govU_swQ4IcynOj4AB-ao",
    authDomain: "game-zone-chat1.firebaseapp.com",
    projectId: "game-zone-chat1",
    storageBucket: "game-zone-chat1.firebasestorage.app",
    messagingSenderId: "932733239188",
    appId: "1:932733239188:web:634fbfc00a396c761a1981"
};

firebase.initializeApp(firebaseConfig);
const db = firebase.firestore();
const auth = firebase.auth();

let myData = null;
let currentReply = null;
let selectedUID = null;
let selectedMID = null;

// ==========================================
// 2. وظائف الواجهة
// ==========================================
function showPopup(msg) {
    const p = document.getElementById('alert-popup');
    p.innerText = msg; p.style.display = 'block';
    setTimeout(() => p.style.display = 'none', 3000);
}

function closeAdmin() { document.getElementById('admin-panel').style.display = 'none'; }

// ==========================================
// 3. التحكم والمزامنة
// ==========================================
async function handleLogin() {
    const e = document.getElementById('login-email').value;
    const p = document.getElementById('login-pass').value;
    try {
        await auth.signInWithEmailAndPassword(e, p);
    } catch {
        const r = await auth.createUserWithEmailAndPassword(e, p);
        await db.collection('users').doc(r.user.uid).set({
            uid: r.user.uid, email: e, name: e.split('@')[0], isMuted: false
        });
    }
    location.reload();
}

auth.onAuthStateChanged(async user => {
    if(user) {
        document.getElementById('login-overlay').style.display = 'none';
        const doc = await db.collection('users').doc(user.uid).get();
        myData = doc.data();
        
        const isF = user.email === FOUNDER_EMAIL;
        document.getElementById('rank-badge').innerHTML = isF ? 
            '<span style="background:var(--founder-red); color:white; padding:5px 12px; border-radius:8px; font-weight:900; font-size:0.7rem; box-shadow:0 0 15px rgba(255,0,0,0.4);">المؤسس ⚡</span>' :
            '<span style="background:#333; color:#aaa; padding:5px 12px; border-radius:8px; font-weight:900; font-size:0.7rem;">محارب 🛡️</span>';
        
        loadMessages();
        setTimeout(() => document.getElementById('loading-screen').style.display = 'none', 1000);
    } else {
        document.getElementById('login-overlay').style.display = 'flex';
        document.getElementById('loading-screen').style.display = 'none';
    }
});

function openAdminMenu(uid, mid, name, e) {
    e.preventDefault();
    selectedUID = uid;
    selectedMID = mid;
    const panel = document.getElementById('admin-panel');
    document.getElementById('target-name').innerText = "التحكم في " + name;
    
    // إظهار ميزة الحذف فقط للمؤسس
    if(auth.currentUser.email === FOUNDER_EMAIL) {
        document.getElementById('founder-delete-btn').style.display = 'flex';
    }

    panel.style.display = 'block';
    panel.style.left = "20px";
    panel.style.top = e.clientY > (window.innerHeight - 250) ? (e.clientY - 220) + "px" : e.clientY + "px";
}

async function execAdmin(type) {
    if(type === 'delete') {
        if(confirm("يا مؤسس، هل أنت متأكد من مسح هذه الرسالة؟")) {
            await db.collection('messages').doc(selectedMID).delete();
            showPopup("تم سحق الرسالة بنجاح 🗑️");
        }
    } else {
        if(auth.currentUser.email !== FOUNDER_EMAIL) return showPopup("هذه القوة للمؤسس فقط!");
        await db.collection('users').doc(selectedUID).update({ isMuted: (type === 'mute') });
        showPopup(type === 'mute' ? "تم إخراس العضو 🤐" : "تم إعادة صوته 🗣️");
    }
    closeAdmin();
}

function startReply(name, text) {
    currentReply = { name, text };
    document.getElementById('reply-info').innerText = "رداً على " + name + ": " + text.substring(0,25) + "...";
    document.getElementById('reply-preview').style.display = 'flex';
    document.getElementById('user-msg').focus();
}

function cancelReply() {
    currentReply = null;
    document.getElementById('reply-preview').style.display = 'none';
}

async function sendMessage() {
    const input = document.getElementById('user-msg');
    const txt = input.value.trim();
    if(!txt || myData.isMuted) {
        if(myData.isMuted) showPopup("أنت مكتوم بأمر الإدارة!");
        return;
    }

    await db.collection('messages').add({
        uid: auth.currentUser.uid,
        name: myData.name,
        email: auth.currentUser.email,
        text: txt,
        reply: currentReply,
        createdAt: firebase.firestore.FieldValue.serverTimestamp()
    });

    input.value = "";
    cancelReply();
}

function loadMessages() {
    db.collection('messages').orderBy('createdAt', 'asc').limitToLast(60).onSnapshot(snap => {
        const box = document.getElementById('chat-container');
        box.innerHTML = "";
        
        snap.forEach(doc => {
            const m = doc.data();
            const isMe = m.uid === auth.currentUser.uid;
            const isFounder = m.email === FOUNDER_EMAIL;
            
            const row = document.createElement('div');
            row.className = "message-row";
            
            const msg = document.createElement('div');
            msg.className = `message ${isMe ? 'my-message' : ''} ${isFounder ? 'msg-founder' : ''}`;
            
            let replyHtml = m.reply ? `<div class="reply-content">↩ ${m.reply.name}: ${m.reply.text}</div>` : '';

            msg.innerHTML = `
                ${replyHtml}
                <div class="user-info">
                    <span class="username" onclick="openAdminMenu('${m.uid}', '${doc.id}', '${m.name}', event)">${m.name}</span>
                    <span class="reply-btn" onclick="startReply('${m.name}', '${m.text}')">رد</span>
                </div>
                <div style="word-wrap: break-word; line-height: 1.6; font-size:0.95rem;">${m.text}</div>
            `;
            
            row.appendChild(msg);
            box.appendChild(row);
        });
        // السكرول التلقائي لأسفل مع كل رسالة جديدة
        box.scrollTop = box.scrollHeight;
    });
}

// إغلاق القوائم عند لمس منطقة الرسائل
document.getElementById('chat-container').addEventListener('click', closeAdmin);
</script>
</body>
</html>
