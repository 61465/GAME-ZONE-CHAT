<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>GAME ZONE | OS FIX</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap');
        :root { --gold: #D4AF37; --dark-bg: #050505; --panel: #111; }
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Cairo', sans-serif; outline: none; }
        body { background: var(--dark-bg); color: #fff; height: 100vh; overflow: hidden; display: flex; }

        /* شاشات الدخول */
        .overlay { position: fixed; inset: 0; background: var(--dark-bg); z-index: 10000; display: flex; justify-content: center; align-items: center; padding: 20px; }
        .win-box { background: var(--panel); border: 2px solid var(--gold); padding: 25px; border-radius: 15px; width: 100%; max-width: 350px; text-align: center; }
        input { width: 100%; padding: 14px; margin-bottom: 15px; background: #000; border: 1px solid #333; color: #fff; border-radius: 10px; font-size: 1rem; text-align: center; }

        /* الهيكل الرئيسي */
        #app { display: none; width: 100%; height: 100vh; flex-direction: row-reverse; }
        .sidebar { width: 280px; background: #000; border-left: 2px solid var(--gold); display: flex; flex-direction: column; transition: 0.3s; }
        .chat-main { flex: 1; display: flex; flex-direction: column; background: #080808; position: relative; }

        /* الرتب */
        .rank { font-size: 0.55rem; padding: 2px 6px; border-radius: 4px; font-weight: bold; margin-left: 5px; color: white; vertical-align: middle; }
        .r-founder { background: #ff3e3e; box-shadow: 0 0 5px #ff3e3e; } 
        .r-legend { background: #a333c8; } 
        .r-active { background: #2185d0; } 
        .r-new { background: #767676; }

        /* الرسائل */
        .msg-area { flex: 1; overflow-y: auto; padding: 15px; display: flex; flex-direction: column; gap: 15px; }
        .bubble { max-width: 85%; padding: 12px; border-radius: 15px; position: relative; font-size: 0.95rem; border: 1px solid #222; line-height: 1.4; }
        .bubble.me { align-self: flex-end; background: var(--gold); color: #000; border-bottom-left-radius: 2px; }
        .bubble.user { align-self: flex-start; background: #1a1a1a; border-right: 4px solid var(--gold); border-bottom-right-radius: 2px; }

        .header { padding: 12px; background: #000; border-bottom: 2px solid var(--gold); display: flex; justify-content: space-between; align-items: center; }
        .input-bar { padding: 12px; background: #000; display: flex; gap: 10px; border-top: 1px solid #222; }
        .btn-gold { background: var(--gold); border: none; padding: 12px 25px; border-radius: 10px; font-weight: 900; cursor: pointer; color: black; transition: 0.2s; }
        .btn-gold:active { transform: scale(0.95); opacity: 0.8; }

        @media (max-width: 768px) { .sidebar { position: absolute; right: -100%; height: 100%; z-index: 1001; } .sidebar.open { right: 0; } }
    </style>
</head>
<body>

<div id="auth-screen" class="overlay">
    <div class="win-box">
        <h2 style="color:var(--gold); font-weight: 900; letter-spacing: 2px;">GAME ZONE</h2><br>
        <input type="email" id="email" placeholder="البريد الإلكتروني">
        <input type="password" id="pass" placeholder="كلمة السر">
        <button class="btn-gold" style="width:100%" onclick="login()">دخول / تسجيل</button>
    </div>
</div>

<div id="nick-screen" class="overlay" style="display:none">
    <div class="win-box">
        <h3 style="color:var(--gold)">اختر اسمك المستعار</h3><br>
        <input type="text" id="nickInput" placeholder="اكتب اسمك هنا...">
        <button class="btn-gold" id="saveNickBtn" style="width:100%" onclick="updateNickname()">حفظ والبدء</button>
    </div>
</div>

<div id="app">
    <aside class="sidebar" id="adminSidebar">
        <div style="padding:20px; border-bottom:1px solid #222; text-align:center; color:var(--gold); font-weight:bold">لوحة الإدارة</div>
        <div id="userList" style="flex:1; overflow-y:auto"></div>
        <button onclick="clearChat()" style="background:#ff3e3e; color:white; border:none; padding:15px; font-weight:bold; cursor:pointer">تطهير الشات بالكامل</button>
    </aside>

    <main class="chat-main">
        <header class="header">
            <button onclick="document.getElementById('adminSidebar').classList.toggle('open')" id="adminIcon" style="background:none; border:none; color:var(--gold); display:none"><i class="fas fa-users-cog fa-lg"></i></button>
            <div style="text-align:center">
                <div id="displayNick" style="font-weight:900; color: var(--gold);"></div>
                <div onclick="document.getElementById('nick-screen').style.display='flex'" style="font-size:0.65rem; color:#aaa; cursor:pointer">تغيير الاسم <i class="fas fa-edit"></i></div>
            </div>
            <i class="fas fa-sign-out-alt fa-lg" onclick="auth.signOut(); location.reload()" style="cursor:pointer; color:#555"></i>
        </header>

        <div class="msg-area" id="msgBox"></div>

        <footer class="input-bar">
            <input type="text" id="msgInput" placeholder="اكتب رسالة..." style="margin-bottom:0">
            <button class="btn-gold" onclick="send()"><i class="fas fa-paper-plane"></i></button>
        </footer>
    </main>
</div>

<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>

<script>
// الإعدادات
const FOUNDER_ID = "abdarahman10555@gmail.com";
const firebaseConfig = {
    apiKey: "AIzaSyBqu1IE24FhA-govU_swQ4IcynOj4AB-ao",
    authDomain: "game-zone-chat1.firebaseapp.com",
    projectId: "game-zone-chat1",
    storageBucket: "game-zone-chat1.firebasestorage.app",
    messagingSenderId: "932733239188",
    appId: "1:932733239188:web:634fbfc00a396c761a1981"
};

firebase.initializeApp(firebaseConfig);
const db = firebase.firestore();
const auth = firebase.auth();
let myData = null;
let isMuted = false;

// دالة حساب الرتبة بناءً على تاريخ الانضمام
function getRank(joinDate, email) {
    if (email === FOUNDER_ID) return { n: "FOUNDER", c: "r-founder" };
    if (!joinDate) return { n: "NEW", c: "r-new" };
    const days = Math.floor((new Date() - joinDate.toDate()) / (1000 * 60 * 60 * 24));
    if (days >= 30) return { n: "LEGEND", c: "r-legend" };
    if (days >= 3) return { n: "ACTIVE", c: "r-active" };
    return { n: "NEW", c: "r-new" };
}

// نظام الدخول
async function login() {
    const e = document.getElementById('email').value.trim();
    const p = document.getElementById('pass').value.trim();
    if(!e || !p) { alert("أدخل البيانات كاملة"); return; }
    try { 
        await auth.signInWithEmailAndPassword(e, p); 
    } catch (err) { 
        try { await auth.createUserWithEmailAndPassword(e, p); } 
        catch (e2) { alert("خطأ: " + e2.message); }
    }
}

// مراقبة حالة المستخدم
auth.onAuthStateChanged(async user => {
    if(user) {
        // فحص الحظر
        const banDoc = await db.collection('bans').doc(user.email).get();
        if(banDoc.exists) { alert("أنت محظور نهائياً"); auth.signOut(); return; }

        // فحص الميوت
        db.collection('mutes').doc(user.email).onSnapshot(doc => {
            isMuted = doc.exists;
            document.getElementById('msgInput').placeholder = isMuted ? "أنت مكتوم حالياً" : "اكتب رسالة...";
        });

        // جلب بيانات المستخدم
        const userRef = db.collection('users').doc(user.email);
        const doc = await userRef.get();
        
        if(!doc.exists) {
            document.getElementById('auth-screen').style.display = 'none';
            document.getElementById('nick-screen').style.display = 'flex';
        } else {
            myData = doc.data();
            startApp();
        }
    }
});

// دالة تحديث الاسم (تم إصلاحها جذرياً)
async function updateNickname() {
    const btn = document.getElementById('saveNickBtn');
    const name = document.getElementById('nickInput').value.trim();
    
    if(!name) { alert("من فضلك اكتب اسماً"); return; }
    if(name.length > 15) { alert("الاسم طويل جداً"); return; }

    btn.disabled = true;
    btn.innerText = "جاري الحفظ...";

    try {
        const user = auth.currentUser;
        const payload = {
            name: name,
            email: user.email,
            joinDate: myData ? myData.joinDate : firebase.firestore.FieldValue.serverTimestamp()
        };

        await db.collection('users').doc(user.email).set(payload, {merge: true});
        myData = payload; // تحديث البيانات محلياً فوراً
        
        // إجبار الواجهة على التغير
        document.getElementById('nick-screen').style.display = 'none';
        startApp();
        
    } catch (err) {
        alert("فشل الحفظ: " + err.message);
        btn.disabled = false;
        btn.innerText = "حفظ والبدء";
    }
}

// تشغيل الشات
function startApp() {
    document.getElementById('auth-screen').style.display = 'none';
    document.getElementById('nick-screen').style.display = 'none';
    document.getElementById('app').style.display = 'flex';
    document.getElementById('displayNick').innerText = myData.name;
    
    if(auth.currentUser.email === FOUNDER_ID) {
        document.getElementById('adminIcon').style.display = 'block';
        loadAdminPanel();
    }
    loadMessages();
}

// إرسال رسالة
async function send() {
    const inp = document.getElementById('msgInput');
    const val = inp.value.trim();
    if(!val || isMuted || !myData) return;
    
    try {
        await db.collection('messages').add({
            text: val,
            sender: myData.email,
            name: myData.name,
            joinDate: myData.joinDate,
            time: firebase.firestore.FieldValue.serverTimestamp()
        });
        inp.value = "";
    } catch (e) { alert("خطأ في الإرسال"); }
}

// دعم زر Enter
document.getElementById('msgInput').addEventListener('keypress', e => { if (e.key === 'Enter') send(); });

// عرض الرسائل
function loadMessages() {
    db.collection('messages').orderBy('time').limitToLast(50).onSnapshot(snap => {
        const box = document.getElementById('msgBox');
        box.innerHTML = "";
        snap.forEach(doc => {
            const m = doc.data();
            const r = getRank(m.joinDate, m.sender);
            const isMe = m.sender === auth.currentUser.email;
            
            const div = document.createElement('div');
            div.className = `bubble ${isMe ? 'me' : 'user'}`;
            div.innerHTML = `
                <div style="font-size:0.65rem; margin-bottom:5px; font-weight:bold; opacity: 0.8;">
                    <span class="rank ${r.c}">${r.n}</span> ${m.name}
                </div>
                <div style="word-break: break-word;">${m.text}</div>
                ${(auth.currentUser.email === FOUNDER_ID) ? `<i class="fas fa-trash-alt" style="color:#ff3e3e; font-size:11px; cursor:pointer; margin-top:5px; display:block;" onclick="deleteMsg('${doc.id}')"></i>` : ''}
            `;
            box.appendChild(div);
        });
        box.scrollTop = box.scrollHeight;
    });
}

// لوحة الإدارة
function loadAdminPanel() {
    db.collection('users').onSnapshot(snap => {
        const list = document.getElementById('userList');
        list.innerHTML = "";
        snap.forEach(doc => {
            const u = doc.data();
            if(u.email === FOUNDER_ID) return;
            const d = document.createElement('div');
            d.style = "padding:15px; border-bottom:1px solid #111; font-size:0.85rem";
            d.innerHTML = `
                <div style="color:var(--gold); margin-bottom:10px;">${u.name}</div>
                <div style="display:flex; gap:10px">
                    <button onclick="toggleMute('${u.email}')" style="flex:1; background:#f2711c; border:none; padding:8px; border-radius:5px; color:white; cursor:pointer">كتم/إلغاء</button>
                    <button onclick="ban('${u.email}')" style="flex:1; background:#db2828; border:none; padding:8px; border-radius:5px; color:white; cursor:pointer">حظر</button>
                </div>`;
            list.appendChild(d);
        });
    });
}

// وظائف المؤسس
async function toggleMute(email) {
    const ref = db.collection('mutes').doc(email);
    const d = await ref.get();
    d.exists ? await ref.delete() : await ref.set({m: true});
}
async function ban(email) { if(confirm("حظر هذا المستخدم للأبد؟")) await db.collection('bans').doc(email).set({b: true}); }
async function deleteMsg(id) { await db.collection('messages').doc(id).delete(); }
async function clearChat() { if(confirm("هل أنت متأكد من مسح جميع الرسائل؟")) { const s = await db.collection('messages').get(); s.forEach(d => d.ref.delete()); } }

</script>
</body>
</html>
