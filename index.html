<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Game Zone | Game Zone Chat</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        :root { 
            --bg-black: #050505; 
            --gold-main: #D4AF37; 
            --dark-card: #121212; 
            --founder-red: #ff0000;
            --text-gray: #b3b3b3;
        }
        
        body { 
            font-family: 'Cairo', sans-serif; 
            background-color: var(--bg-black); 
            color: white; 
            margin: 0; 
            display: flex; 
            flex-direction: column; 
            height: 100vh; 
            overflow: hidden; 
        }

        /* --- تصميم الرتب الملكية --- */
        .rank-founder { color: var(--founder-red) !important; text-shadow: 0 0 12px red; font-weight: 900; cursor: pointer; }
        .rank-wise { color: #9c27b0; text-shadow: 0 0 8px #9c27b0; font-weight: 900; }
        .rank-legend { color: #e91e63; font-weight: 900; }
        .rank-warrior { color: #ff5722; font-weight: bold; }
        .rank-diamond { color: #00e5ff; font-weight: bold; }
        .rank-gold { color: #ffd700; text-shadow: 0 0 5px #ffd700; }
        .rank-active { color: #4caf50; }
        .rank-new { color: #888; }
        .rank-clickable { cursor: pointer; transition: 0.3s; }
        .rank-clickable:hover { text-decoration: underline; }

        header { 
            background: var(--dark-card); 
            padding: 15px 25px; 
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
            border-bottom: 2px solid var(--gold-main);
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
        }

        #chat-container { 
            flex: 1; 
            overflow-y: auto; 
            padding: 20px; 
            background: radial-gradient(circle at center, #1a1a1a 0%, #050505 100%);
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .message { 
            background: rgba(255, 255, 255, 0.05); 
            padding: 12px 18px; 
            border-radius: 15px; 
            max-width: 80%; 
            border-right: 4px solid var(--gold-main);
            position: relative;
            animation: fadeIn 0.3s ease;
        }

        .msg-founder { 
            border: 1px solid var(--gold-main);
            border-right: 6px solid var(--founder-red);
            background: rgba(255, 0, 0, 0.05);
        }

        /* ميزة الرد */
        .reply-container {
            background: rgba(255, 255, 255, 0.1);
            border-right: 3px solid var(--gold-main);
            padding: 5px 10px;
            margin-bottom: 8px;
            border-radius: 5px;
            font-size: 0.75rem;
            color: #ddd;
        }
        
        .reply-box-active {
            background: #1a1a1a;
            padding: 10px 20px;
            border-top: 1px solid var(--gold-main);
            display: none;
            justify-content: space-between;
            align-items: center;
        }

        .btn-reply-action {
            font-size: 0.65rem;
            color: var(--gold-main);
            cursor: pointer;
            margin-right: 15px;
            font-weight: bold;
        }

        /* لوحة المؤسس */
        #founder-menu {
            position: fixed;
            background: #181818;
            border: 1px solid var(--gold-main);
            border-radius: 10px;
            padding: 10px;
            display: none;
            z-index: 10000;
            box-shadow: 0 10px 30px rgba(0,0,0,0.8);
            min-width: 150px;
        }

        #founder-menu button {
            width: 100%;
            padding: 10px;
            margin: 5px 0;
            background: #252525;
            color: white;
            border: 1px solid #333;
            border-radius: 5px;
            cursor: pointer;
            font-family: 'Cairo';
            text-align: right;
        }

        #founder-menu button:hover {
            background: var(--gold-main);
            color: black;
        }

        .input-area { 
            padding: 20px; 
            background: var(--dark-card); 
            display: flex; 
            gap: 10px; 
            border-top: 1px solid #333;
        }

        input { 
            flex: 1; 
            background: #000; 
            border: 1px solid var(--gold-main); 
            padding: 12px; 
            border-radius: 10px; 
            color: #fff; 
            outline: none;
        }

        button#main-send-btn { 
            background: var(--gold-main); 
            color: black; 
            border: none; 
            padding: 10px 25px; 
            border-radius: 10px; 
            font-weight: 900; 
            cursor: pointer;
            transition: 0.3s;
        }

        #login-overlay { 
            position: fixed; inset: 0; background: #000; 
            z-index: 9999; display: flex; justify-content: center; align-items: center; 
        }

        .login-card {
            background: var(--dark-card); padding: 40px; border-radius: 20px;
            border: 2px solid var(--gold-main); text-align: center; width: 350px;
        }
    </style>
</head>
<body>

<div id="founder-menu">
    <div id="target-info" style="font-size: 0.75rem; color: var(--gold-main); margin-bottom: 8px; text-align: center; font-weight: bold;"></div>
    <button onclick="adminAction('mute')">كتم المستخدم (Mute)</button>
    <button onclick="adminAction('unmute')">إلغاء الكتم (Unmute)</button>
    <button onclick="document.getElementById('founder-menu').style.display='none'" style="color: #ff4444;">إغلاق</button>
</div>

<div id="login-overlay">
    <div class="login-card">
        <h1 style="color: var(--gold-main); margin-bottom: 30px;">GAME ZONE CHAT</h1>
        <input type="email" id="auth-email" placeholder="البريد الإلكتروني"><br><br>
        <input type="password" id="auth-pass" placeholder="كلمة السر"><br><br>
        <button onclick="accessSystem()" style="width: 100%; height: 45px; background: var(--gold-main); border-radius: 10px; font-weight: 900; cursor: pointer;">دخول المجلس</button>
    </div>
</div>

<header>
    <div style="font-size: 1.4rem; font-weight: 900; color: var(--gold-main);">Game Zone Chat ⚡</div>
    <div style="display: flex; gap: 15px; align-items: center;">
        <button id="muted-list-btn" onclick="showMutedUsers()" style="display:none; font-size: 0.65rem; background: #222; color: var(--gold-main); border: 1px solid var(--gold-main); padding: 5px 10px;">المكتومين</button>
        <div id="my-status" style="text-align: left; font-size: 0.8rem;"></div>
    </div>
</header>

<div id="chat-container"></div>

<div id="reply-preview-bar" class="reply-box-active">
    <div id="reply-target-text" style="font-size: 0.75rem; color: #aaa;"></div>
    <span onclick="cancelReply()" style="color: var(--founder-red); cursor: pointer; font-weight: bold;">✖</span>
</div>

<div class="input-area">
    <input type="text" id="user-msg" placeholder="تحدث برقي..." onkeypress="if(event.key==='Enter') processAndSend()">
    <button id="main-send-btn" onclick="processAndSend()">إرسال</button>
</div>

<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>

<script>
// ==========================================
// 1. نظام الحماية الملكي المتقدم (الأصلي كاملاً)
// ==========================================
class RoyalProtectionSystem {
    constructor() {
        this.bannedCategories = {
            sexual: ["sex", "porn", "سكس", "نيك", "عري", "قحبة", "شرموطة"],
            violence: ["kill", "قتل", "ذبح", "ارهاب", "مجزرة"],
            drugs: ["مخدرات", "حشيش", "هيروين", "خمر"],
            hate: ["fuck", "shit", "وسخ", "حقير", "كلب"],
            racism: ["عنصري", "طائفي", "كافر", "مرتد"]
        };
    }

    scanAndSanitize(message) {
        let sanitized = message;
        let riskScore = 0;
        for (const [cat, words] of Object.entries(this.bannedCategories)) {
            words.forEach(word => {
                if (message.includes(word)) {
                    sanitized = sanitized.split(word).join("⚠️");
                    riskScore += 2;
                }
            });
        }
        return { safe: riskScore < 4, sanitized, riskScore };
    }
}
const royalGuard = new RoyalProtectionSystem();

// ==========================================
// 2. إعدادات Firebase والبيانات
// ==========================================
const FOUNDER_EMAIL = "abdarahman10555@gmail.com";
const firebaseConfig = {
    apiKey: "AIzaSyBqu1IE24FhA-govU_swQ4IcynOj4AB-ao",
    authDomain: "game-zone-chat1.firebaseapp.com",
    projectId: "game-zone-chat1",
    storageBucket: "game-zone-chat1.firebasestorage.app",
    messagingSenderId: "932733239188",
    appId: "1:932733239188:web:634fbfc00a396c761a1981"
};

firebase.initializeApp(firebaseConfig);
const db = firebase.firestore();
const auth = firebase.auth();
let currentUserProfile = null;
let currentReplyData = null;
let selectedAdminUserId = null;

// ==========================================
// 3. نظام الرتب الزمني المطور (3 أيام)
// ==========================================
function getRank(joinedAt, email) {
    if (email === FOUNDER_EMAIL) return { title: "المؤسس ⚡", class: "rank-founder" };
    if (!joinedAt) return { title: "عضو جديد 🥚", class: "rank-new", next: "3 أيام للترقية" };

    const diffDays = (Date.now() - joinedAt.toMillis()) / 86400000;

    if (diffDays >= 180) return { title: "شيخ الحكمة ⚜️", class: "rank-wise", next: "رتبة قصوى" };
    if (diffDays >= 90) return { title: "أسطورة الزون 👑", class: "rank-legend", next: (180 - diffDays).toFixed(1) + " يوم" };
    if (diffDays >= 30) return { title: "محارب الزون ⚔️", class: "rank-warrior", next: (90 - diffDays).toFixed(1) + " يوم" };
    if (diffDays >= 20) return { title: "عضو ماسي 💎", class: "rank-diamond", next: (30 - diffDays).toFixed(1) + " يوم" };
    if (diffDays >= 10) return { title: "عضو ذهبي 🏆", class: "rank-gold", next: (20 - diffDays).toFixed(1) + " يوم" };
    if (diffDays >= 3) return { title: "عضو نشط 🔥", class: "rank-active", next: (10 - diffDays).toFixed(1) + " يوم" };

    return { title: "عضو جديد 🥚", class: "rank-new", next: (3 - diffDays).toFixed(1) + " يوم" };
}

// ==========================================
// 4. ميزات المؤسس والرد
// ==========================================
function openAdminPanel(uid, name, event) {
    if (auth.currentUser.email !== FOUNDER_EMAIL) return;
    event.preventDefault();
    selectedAdminUserId = uid;
    document.getElementById('target-info').innerText = "التحكم بـ: " + name;
    const menu = document.getElementById('founder-menu');
    menu.style.display = 'block';
    menu.style.top = event.pageY + "px";
    menu.style.left = event.pageX + "px";
}

async function adminAction(type) {
    if (!selectedAdminUserId) return;
    const isMuted = type === 'mute';
    await db.collection('users').doc(selectedAdminUserId).update({ isMuted: isMuted });
    alert(isMuted ? "تم كتم المستخدم بنجاح" : "تم فك الكتم بنجاح");
    document.getElementById('founder-menu').style.display = 'none';
}

async function showMutedUsers() {
    const snap = await db.collection('users').where('isMuted', '==', true).get();
    let names = "قائمة المكتومين:\n";
    snap.forEach(d => names += "- " + d.data().name + "\n");
    alert(snap.empty ? "لا يوجد أحد في الكتم حالياً" : names);
}

function prepareReply(name, text) {
    currentReplyData = { name, text };
    document.getElementById('reply-target-text').innerText = "الرد على " + name + ": " + text.substring(0, 30) + "...";
    document.getElementById('reply-preview-bar').style.display = 'flex';
    document.getElementById('user-msg').focus();
}

function cancelReply() {
    currentReplyData = null;
    document.getElementById('reply-preview-bar').style.display = 'none';
}

// ==========================================
// 5. إدارة الجلسة والرسائل
// ==========================================
async function accessSystem() {
    const email = document.getElementById('auth-email').value;
    const pass = document.getElementById('auth-pass').value;
    if(!email || !pass) return;
    try {
        await auth.signInWithEmailAndPassword(email, pass);
    } catch (e) {
        const res = await auth.createUserWithEmailAndPassword(email, pass);
        await db.collection('users').doc(res.user.uid).set({
            uid: res.user.uid, email, name: email.split('@')[0],
            isMuted: false, joinedAt: firebase.firestore.FieldValue.serverTimestamp()
        });
    }
    location.reload();
}

auth.onAuthStateChanged(async user => {
    if (user) {
        const doc = await db.collection('users').doc(user.uid).get();
        currentUserProfile = doc.data();
        document.getElementById('login-overlay').style.display = 'none';
        if (user.email === FOUNDER_EMAIL) document.getElementById('muted-list-btn').style.display = 'block';
        
        const r = getRank(currentUserProfile.joinedAt, user.email);
        document.getElementById('my-status').innerHTML = `<span class="${r.class}">${r.title}</span><br><span style="color:var(--text-gray); font-size:0.65rem;">الترقية: ${r.next}</span>`;
        startListening();
    }
});

async function processAndSend() {
    const input = document.getElementById('user-msg');
    const text = input.value.trim();
    if (!text || !currentUserProfile) return;
    if (currentUserProfile.isMuted) { alert("أنت ممنوع من الكتابة حالياً (Mute)"); return; }

    const safety = royalGuard.scanAndSanitize(text);
    await db.collection('messages').add({
        uid: auth.currentUser.uid,
        name: currentUserProfile.name,
        email: auth.currentUser.email,
        text: safety.sanitized,
        replyData: currentReplyData,
        createdAt: firebase.firestore.FieldValue.serverTimestamp()
    });
    input.value = "";
    cancelReply();
}

function startListening() {
    db.collection('messages').orderBy('createdAt', 'asc').limitToLast(50).onSnapshot(snap => {
        const chat = document.getElementById('chat-container');
        chat.innerHTML = "";
        snap.forEach(async d => {
            const m = d.data();
            const isF = m.email === FOUNDER_EMAIL;
            
            const msgDiv = document.createElement('div');
            msgDiv.className = `message ${isF ? 'msg-founder' : ''}`;
            
            let replyBlock = m.replyData ? `<div class="reply-container">↩ رداً على ${m.replyData.name}: ${m.replyData.text.substring(0, 20)}...</div>` : '';
            
            msgDiv.innerHTML = `
                ${replyBlock}
                <div style="font-size:0.7rem; margin-bottom:5px; display: flex; justify-content: space-between;">
                    <span class="${isF?'rank-founder':'rank-clickable'}" onclick="openAdminPanel('${m.uid}', '${m.name}', event)">${m.name}</span>
                    <span class="btn-reply-action" onclick="prepareReply('${m.name}', '${m.text}')">رد</span>
                </div>
                <div style="word-break: break-word;">${m.text}</div>
            `;
            chat.appendChild(msgDiv);
            chat.scrollTop = chat.scrollHeight;
        });
    });
}
// إغلاق القائمة عند الضغط في أي مكان
window.onclick = function(event) { if (!event.target.matches('.rank-clickable')) document.getElementById('founder-menu').style.display = 'none'; }
</script>
</body>
</html>
