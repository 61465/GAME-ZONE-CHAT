<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Game Zone Chat | Founder Edition</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-black: #050505;
            --gold-main: #D4AF37;
            --gold-glow: #FFD700;
            --dark-card: #121212;
            --text-white: #ffffff;
            --founder-red: #ff0000;
        }

        body {
            font-family: 'Cairo', sans-serif;
            background-color: var(--bg-black);
            color: var(--text-white);
            margin: 0;
            display: flex;
            flex-direction: column;
            height: 100vh;
            overflow: hidden;
        }

        #login-screen {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.98);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }
        .login-box {
            background: var(--dark-card);
            padding: 40px;
            border-radius: 15px;
            border: 2px solid var(--gold-main);
            text-align: center;
            box-shadow: 0 0 30px rgba(212, 175, 55, 0.3);
            width: 90%;
            max-width: 400px;
        }

        header {
            background: var(--dark-card);
            padding: 15px 25px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 2px solid var(--gold-main);
        }

        #chat-container {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 15px;
            background: radial-gradient(circle at center, #1a1a1a 0%, #050505 100%);
        }

        .message {
            background: #1a1a1a;
            padding: 12px 18px;
            border-radius: 12px;
            max-width: 80%;
            align-self: flex-start;
            border: 1px solid #333;
            border-right: 4px solid var(--gold-main);
            animation: fadeIn 0.3s ease;
        }

        /* ستايل المؤسس الخاص */
        .msg-founder {
            border: 2px solid var(--gold-main) !important;
            border-right: 8px solid var(--founder-red) !important;
            box-shadow: 0 0 15px rgba(212, 175, 55, 0.2);
            background: #000 !important;
        }

        .rank-founder {
            color: var(--founder-red) !important;
            text-shadow: 0 0 10px var(--founder-red), 0 0 20px var(--gold-main);
            font-weight: 900;
            animation: founderPulse 1.5s infinite alternate;
        }

        @keyframes founderPulse {
            from { opacity: 0.8; transform: scale(1); }
            to { opacity: 1; transform: scale(1.02); }
        }

        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

        .msg-info {
            font-size: 0.8rem;
            margin-bottom: 5px;
            display: flex;
            gap: 10px;
            font-weight: bold;
            color: var(--gold-main);
        }

        .rank-legend { color: var(--gold-glow); text-shadow: 0 0 10px var(--gold-main); }

        .input-box {
            background: var(--dark-card);
            padding: 20px;
            display: flex;
            gap: 10px;
            border-top: 2px solid var(--gold-main);
        }

        input {
            flex: 1;
            background: #000;
            border: 1px solid var(--gold-main);
            padding: 12px;
            border-radius: 8px;
            color: #fff;
            outline: none;
            font-family: 'Cairo';
        }

        button {
            background: var(--gold-main);
            color: black;
            border: none;
            padding: 0 25px;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s;
        }

        button:hover { background: var(--gold-glow); transform: scale(1.05); }
    </style>
</head>
<body>

<div id="login-screen">
    <div class="login-box">
        <h1 style="color: var(--gold-main); font-weight: 900; margin-bottom: 10px;">GAME ZONE VIP</h1>
        <p style="color: #aaa; margin-bottom: 25px;">مرحباً بك يا مؤسس</p>
        <input type="text" id="username" placeholder="اكتب اسمك هنا..." style="width: 85%; margin-bottom: 20px; text-align: center;">
        <br>
        <button onclick="joinChat()" style="width: 95%; height: 45px;">دخول المجلس</button>
    </div>
</div>

<header>
    <div style="font-size: 1.5rem; font-weight: 900; color: var(--gold-main);">GAME ZONE <span style="color: white;">CHAT</span></div>
    <div id="user-badge" style="color: var(--gold-main); font-weight: bold;"></div>
</header>

<div id="chat-container"></div>

<div class="input-box">
    <input type="text" id="msg-input" placeholder="اكتب رسالة..." onkeypress="if(event.key==='Enter') sendMessage()">
    <button onclick="sendMessage()">إرسال</button>
</div>

<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>

<script>
    const firebaseConfig = {
        apiKey: "AIzaSyBqu1IE24FhA-govU_swQ4IcynOj4AB-ao",
        authDomain: "game-zone-chat1.firebaseapp.com",
        projectId: "game-zone-chat1",
        storageBucket: "game-zone-chat1.firebasestorage.app",
        messagingSenderId: "932733239188",
        appId: "1:932733239188:web:634fbfc00a396c761a1981"
    };
    
    firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();
    let myProfile = null;

    // --- السطر الأهم للمؤسس ---
    const FOUNDER_UID = "IYM6ZZoyp6ZVmOVK6OqX1F..."; // تأكد من وضع الـ UID الكامل هنا

    function getRank(joinDate, uid) {
        if (uid === FOUNDER_UID) return { name: "المؤسس ⚡", class: "rank-founder" };
        const days = (Date.now() - joinDate) / (1000 * 60 * 60 * 24);
        if (days >= 90) return { name: "أسطورة GZ 👑", class: "rank-legend" };
        if (days >= 30) return { name: "عضو ملكي 🥇", class: "rank-royal" };
        return { name: "لاعب جديد 🥚", class: "rank-new" };
    }

    async function joinChat() {
        const name = document.getElementById('username').value;
        if (!name) return alert("الرجاء إدخال اسمك!");

        try {
            const userCred = await firebase.auth().signInAnonymously();
            const uid = userCred.user.uid;
            const userRef = db.collection('users').doc(uid);
            const doc = await userRef.get();

            if (!doc.exists) { 
                myProfile = { uid, name, joinDate: Date.now() };
                await userRef.set(myProfile);
            } else {
                myProfile = doc.data();
            }

            document.getElementById('login-screen').style.display = 'none';
            displayBadge();
            listenToMessages();
        } catch (e) {
            console.error(e);
            alert("حدث خطأ في الدخول.");
        }
    }

    function displayBadge() {
        const rank = getRank(myProfile.joinDate, myProfile.uid);
        document.getElementById('user-badge').innerHTML = `<span class="${rank.class}">${rank.name} | ${myProfile.name}</span>`;
    }

    async function sendMessage() {
        const input = document.getElementById('msg-input');
        if (!input.value.trim()) return;

        const currentRank = getRank(myProfile.joinDate, myProfile.uid);
        try {
            await db.collection('messages').add({
                uid: myProfile.uid,
                name: myProfile.name,
                text: input.value,
                rankName: currentRank.name,
                rankClass: currentRank.class,
                createdAt: firebase.firestore.FieldValue.serverTimestamp()
            });
            input.value = "";
        } catch (e) { console.error(e); }
    }

    function listenToMessages() {
        db.collection('messages').orderBy('createdAt', 'asc').limitToLast(50)
            .onSnapshot(snap => {
                const container = document.getElementById('chat-container');
                container.innerHTML = "";
                snap.forEach(doc => {
                    const m = doc.data();
                    const isFounder = m.uid === FOUNDER_UID ? "msg-founder" : "";
                    const div = document.createElement('div');
                    div.className = `message ${isFounder}`;
                    div.innerHTML = `
                        <div class="msg-info">
                            <span class="${m.rankClass}">${m.name}</span> 
                            <span style="color:#666; font-size:0.7rem;">[${m.rankName}]</span>
                        </div>
                        <div style="color: white; word-break: break-word;">${m.text}</div>`;
                    container.appendChild(div);
                });
                container.scrollTop = container.scrollHeight;
            });
    }
</script>
</body>
</html>
