<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Game Zone | The Royal Empire</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        :root { 
            --bg-black: #050505; 
            --gold-main: #D4AF37; 
            --dark-card: #121212; 
            --founder-red: #ff0000;
            --text-gray: #b3b3b3;
        }
        
        body { 
            font-family: 'Cairo', sans-serif; 
            background-color: var(--bg-black); 
            color: white; 
            margin: 0; 
            display: flex; 
            flex-direction: column; 
            height: 100vh; 
            overflow: hidden; 
        }

        /* --- تصميم الرتب الملكية --- */
        .rank-founder { color: var(--founder-red) !important; text-shadow: 0 0 12px red; font-weight: 900; }
        .rank-wise { color: #9c27b0; text-shadow: 0 0 8px #9c27b0; font-weight: 900; }
        .rank-legend { color: #e91e63; font-weight: 900; }
        .rank-warrior { color: #ff5722; font-weight: bold; }
        .rank-diamond { color: #00e5ff; font-weight: bold; }
        .rank-gold { color: #ffd700; text-shadow: 0 0 5px #ffd700; }
        .rank-active { color: #4caf50; }
        .rank-new { color: #888; }

        header { 
            background: var(--dark-card); 
            padding: 15px 25px; 
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
            border-bottom: 2px solid var(--gold-main);
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
        }

        #chat-container { 
            flex: 1; 
            overflow-y: auto; 
            padding: 20px; 
            background: radial-gradient(circle at center, #1a1a1a 0%, #050505 100%);
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .message { 
            background: rgba(255, 255, 255, 0.05); 
            padding: 12px 18px; 
            border-radius: 15px; 
            max-width: 80%; 
            border-right: 4px solid var(--gold-main);
            position: relative;
            animation: fadeIn 0.3s ease;
        }

        .msg-founder { 
            border: 1px solid var(--gold-main);
            border-right: 6px solid var(--founder-red);
            background: rgba(255, 0, 0, 0.05);
        }

        .input-area { 
            padding: 20px; 
            background: var(--dark-card); 
            display: flex; 
            gap: 10px; 
            border-top: 1px solid #333;
        }

        input { 
            flex: 1; 
            background: #000; 
            border: 1px solid var(--gold-main); 
            padding: 12px; 
            border-radius: 10px; 
            color: #fff; 
            outline: none;
        }

        button { 
            background: var(--gold-main); 
            color: black; 
            border: none; 
            padding: 10px 25px; 
            border-radius: 10px; 
            font-weight: 900; 
            cursor: pointer;
            transition: 0.3s;
        }

        button:hover { transform: scale(1.05); filter: brightness(1.2); }

        #login-overlay { 
            position: fixed; inset: 0; background: #000; 
            z-index: 9999; display: flex; justify-content: center; align-items: center; 
        }

        .login-card {
            background: var(--dark-card); padding: 40px; border-radius: 20px;
            border: 2px solid var(--gold-main); text-align: center; width: 350px;
        }

        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body>

<div id="login-overlay">
    <div class="login-card">
        <h1 style="color: var(--gold-main); margin-bottom: 30px;">GAME ZONE</h1>
        <input type="email" id="auth-email" placeholder="البريد الإلكتروني"><br><br>
        <input type="password" id="auth-pass" placeholder="كلمة السر"><br><br>
        <button onclick="accessSystem()">دخول المجلس</button>
        <p style="font-size: 0.8rem; color: var(--text-gray); margin-top: 15px;">ادخل بياناتك وسيتم إنشاء حسابك تلقائياً</p>
    </div>
</div>

<header>
    <div style="font-size: 1.4rem; font-weight: 900; color: var(--gold-main);">EMPIRE CHAT ⚡</div>
    <div id="my-status" style="text-align: left; font-size: 0.8rem;"></div>
</header>

<div id="chat-container"></div>

<div class="input-area">
    <input type="text" id="user-msg" placeholder="تحدث برقي..." onkeypress="if(event.key==='Enter') processAndSend()">
    <button onclick="processAndSend()">إرسال</button>
</div>

<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>

<script>
// ==========================================
// 1. نظام الحماية الملكي المتقدم (الخاص بك كاملاً)
// ==========================================
class RoyalProtectionSystem {
    constructor() {
        this.bannedCategories = {
            sexual: ["sex", "porn", "سكس", "نيك", "عري", "قحبة", "شرموطة"],
            violence: ["kill", "قتل", "ذبح", "ارهاب", "مجزرة"],
            drugs: ["مخدرات", "حشيش", "هيروين", "خمر"],
            hate: ["fuck", "shit", "وسخ", "حقير", "كلب"],
            racism: ["عنصري", "طائفي", "كافر", "مرتد"]
        };
        this.violationHistory = new Map();
        this.bannedUsers = new Map();
    }

    scanAndSanitize(message, userId, userName) {
        let sanitized = message;
        let riskScore = 0;
        let violations = [];

        for (const [cat, words] of Object.entries(this.bannedCategories)) {
            words.forEach(word => {
                if (message.includes(word)) {
                    sanitized = sanitized.split(word).join("⚠️");
                    violations.push(cat);
                    riskScore += 2;
                }
            });
        }

        const safe = riskScore < 4;
        return { safe, sanitized, riskScore, violations };
    }
}

const royalGuard = new RoyalProtectionSystem();

// ==========================================
// 2. إعدادات وقاعدة بيانات Firebase
// ==========================================
const FOUNDER_EMAIL = "abdarahman10555@gmail.com";
const firebaseConfig = {
    apiKey: "AIzaSyBqu1IE24FhA-govU_swQ4IcynOj4AB-ao",
    authDomain: "game-zone-chat1.firebaseapp.com",
    projectId: "game-zone-chat1",
    storageBucket: "game-zone-chat1.firebasestorage.app",
    messagingSenderId: "932733239188",
    appId: "1:932733239188:web:634fbfc00a396c761a1981"
};

firebase.initializeApp(firebaseConfig);
const db = firebase.firestore();
const auth = firebase.auth();
let currentUserProfile = null;

// ==========================================
// 3. نظام الرتب الزمني الصارم (3 أيام)
// ==========================================
function getRank(joinedAt, email) {
    if (email === FOUNDER_EMAIL) return { title: "المؤسس ⚡", class: "rank-founder", next: "ما شاء الله" };
    if (!joinedAt) return { title: "عضو جديد 🥚", class: "rank-new", next: "3 أيام للترقية" };

    const diffDays = (Date.now() - joinedAt.toMillis()) / (1000 * 60 * 60 * 24);

    if (diffDays >= 180) return { title: "شيخ الحكمة ⚜️", class: "rank-wise", next: "رتبة قصوى" };
    if (diffDays >= 90) return { title: "أسطورة الزون 👑", class: "rank-legend", next: (180 - diffDays).toFixed(1) + " يوم" };
    if (diffDays >= 30) return { title: "محارب الزون ⚔️", class: "rank-warrior", next: (90 - diffDays).toFixed(1) + " يوم" };
    if (diffDays >= 20) return { title: "عضو ماسي 💎", class: "rank-diamond", next: (30 - diffDays).toFixed(1) + " يوم" };
    if (diffDays >= 10) return { title: "عضو ذهبي 🏆", class: "rank-gold", next: (20 - diffDays).toFixed(1) + " يوم" };
    if (diffDays >= 3) return { title: "عضو نشط 🔥", class: "rank-active", next: (10 - diffDays).toFixed(1) + " يوم" };

    return { title: "عضو جديد 🥚", class: "rank-new", next: (3 - diffDays).toFixed(1) + " يوم" };
}

// ==========================================
// 4. منطق الدخول والرسائل
// ==========================================
async function accessSystem() {
    const email = document.getElementById('auth-email').value;
    const pass = document.getElementById('auth-pass').value;
    if(!email || !pass) return;

    try {
        const res = await auth.signInWithEmailAndPassword(email, pass);
    } catch (e) {
        const res = await auth.createUserWithEmailAndPassword(email, pass);
        await db.collection('users').doc(res.user.uid).set({
            uid: res.user.uid,
            email: email,
            name: email.split('@')[0],
            joinedAt: firebase.firestore.FieldValue.serverTimestamp()
        });
    }
    location.reload();
}

auth.onAuthStateChanged(async user => {
    if (user) {
        const userDoc = await db.collection('users').doc(user.uid).get();
        currentUserProfile = userDoc.data();
        document.getElementById('login-overlay').style.display = 'none';
        
        const r = getRank(currentUserProfile.joinedAt, user.email);
        document.getElementById('my-status').innerHTML = `
            <span class="${r.class}">${r.title}</span><br>
            <span style="color:var(--text-gray); font-size:0.7rem;">الترقية القادمة: ${r.next}</span>`;
        
        startListening();
    }
});

async function processAndSend() {
    const input = document.getElementById('user-msg');
    const text = input.value.trim();
    if (!text || !currentUserProfile) return;

    // فحص الحماية الملكي
    const check = royalGuard.scanAndSanitize(text, auth.currentUser.uid, currentUserProfile.name);
    
    if (!check.safe && check.riskScore > 5) {
        alert("🛑 رسالتك تحتوي على محتوى مرفوض تماماً حسب قوانين الإمبراطورية!");
        input.value = "";
        return;
    }

    await db.collection('messages').add({
        uid: auth.currentUser.uid,
        name: currentUserProfile.name,
        email: auth.currentUser.email,
        text: check.sanitized,
        createdAt: firebase.firestore.FieldValue.serverTimestamp()
    });
    input.value = "";
}

function startListening() {
    db.collection('messages').orderBy('createdAt', 'asc').limitToLast(50).onSnapshot(snap => {
        const chat = document.getElementById('chat-container');
        chat.innerHTML = "";
        snap.forEach(async doc => {
            const m = doc.data();
            const isF = m.email === FOUNDER_EMAIL;
            
            // جلب رتبة المرسل حية
            const senderDoc = await db.collection('users').doc(m.uid).get();
            const sRank = getRank(senderDoc.data()?.joinedAt, m.email);

            const msgDiv = document.createElement('div');
            msgDiv.className = `message ${isF ? 'msg-founder' : ''}`;
            msgDiv.innerHTML = `
                <div style="font-size:0.7rem; margin-bottom:5px;">
                    <span class="${sRank.class}" style="font-weight:900">${m.name}</span>
                    <span style="color:#666"> [${sRank.title}]</span>
                </div>
                <div style="word-break: break-word;">${m.text}</div>
            `;
            chat.appendChild(msgDiv);
            chat.scrollTop = chat.scrollHeight;
        });
    });
}
</script>
</body>
</html>
