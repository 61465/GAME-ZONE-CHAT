<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Game Zone Elite | لوحة تحكم المؤسس</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;700;900&display=swap" rel="stylesheet">
    <style>
        :root { 
            --bg-black: #050505; 
            --gold-main: #D4AF37; 
            --gold-glow: rgba(212, 175, 55, 0.5);
            --founder-red: #ff0000;
            --ban-color: #4a0000;
        }

        /*  */

        * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

        html, body {
            height: 100%; width: 100%; overflow: hidden;
            background-color: var(--bg-black);
            font-family: 'Cairo', sans-serif; color: white;
            display: flex; flex-direction: column;
        }

        header { 
            height: 75px; background: #000; 
            display: flex; justify-content: space-between; align-items: center; 
            padding: 0 20px; border-bottom: 2px solid var(--gold-main);
            flex-shrink: 0; z-index: 1000;
        }

        #chat-container { 
            flex: 1; overflow-y: auto; padding: 20px;
            display: flex; flex-direction: column; gap: 15px;
            background: linear-gradient(rgba(0,0,0,0.8), rgba(0,0,0,0.8)), url('https://www.transparenttextures.com/patterns/dark-matter.png');
            -webkit-overflow-scrolling: touch;
        }

        /* تصميم رسالة المؤسس المميز */
        .msg-founder {
            border: 2px solid var(--gold-main) !important;
            box-shadow: 0 0 15px var(--gold-glow);
            background: rgba(212, 175, 55, 0.1) !important;
        }

        .message {
            background: rgba(255,255,255,0.05); padding: 12px 15px;
            border-radius: 15px; max-width: 80%; position: relative;
            border-right: 3px solid #333; align-self: flex-start;
        }

        /* أدوات الإدارة السريعة للمؤسس */
        .admin-badge {
            background: var(--founder-red); color: white;
            padding: 2px 8px; border-radius: 5px; font-size: 0.6rem;
            margin-right: 5px; font-weight: 900;
        }

        .footer-fixed {
            background: #0a0a0a; padding: 15px;
            border-top: 1px solid #222; flex-shrink: 0;
        }

        .admin-quick-tools {
            display: flex; gap: 10px; margin-bottom: 10px;
            overflow-x: auto; padding-bottom: 5px;
        }

        .admin-tool-btn {
            background: #1a1a1a; border: 1px solid var(--gold-main);
            color: var(--gold-main); padding: 5px 12px; border-radius: 8px;
            font-size: 0.7rem; cursor: pointer; white-space: nowrap;
        }

        .admin-tool-btn:hover { background: var(--gold-main); color: black; }

        /* لوحة التحكم الجانبية */
        #admin-menu {
            position: fixed; background: #111; border: 2px solid var(--gold-main);
            border-radius: 15px; padding: 15px; display: none; z-index: 9999;
            width: 240px; box-shadow: 0 0 30px rgba(0,0,0,1);
        }

        .admin-btn {
            width: 100%; padding: 10px; margin: 5px 0;
            border: none; border-radius: 8px; font-family: 'Cairo';
            font-weight: bold; cursor: pointer; text-align: right;
        }

        .btn-mute { background: #d4af37; color: black; }
        .btn-ban { background: var(--founder-red); color: white; }
        .btn-del { background: #444; color: white; }

        #login-overlay {
            position: fixed; inset: 0; background: #000; z-index: 10000;
            display: flex; justify-content: center; align-items: center;
        }
    </style>
</head>
<body>

<div id="login-overlay">
    <div style="background:#111; padding:30px; border-radius:20px; border:1px solid var(--gold-main); width:90%; max-width:350px;">
        <h2 style="color:var(--gold-main); text-align:center; margin-bottom:20px;">دخول الإدارة</h2>
        <input type="email" id="email" placeholder="البريد" style="width:100%; padding:12px; margin-bottom:10px; background:#000; border:1px solid #333; color:white; border-radius:8px;">
        <input type="password" id="pass" placeholder="كلمة السر" style="width:100%; padding:12px; margin-bottom:20px; background:#000; border:1px solid #333; color:white; border-radius:8px;">
        <button onclick="login()" style="width:100%; padding:12px; background:var(--gold-main); border:none; border-radius:8px; font-weight:bold;">دخول المجلس</button>
    </div>
</div>

<header>
    <div style="font-weight:900; color:var(--gold-main);">GAME ZONE <span id="admin-indicator"></span></div>
    <div id="online-count" style="font-size:0.7rem; color:#0f0;">متصل الآن...</div>
</header>

<div id="chat-container"></div>

<div class="footer-fixed">
    <div id="founder-tools" class="admin-quick-tools" style="display:none;">
        <button class="admin-tool-btn" onclick="clearAllChat()">🧹 تنظيف المجلس (للجميع)</button>
        <button class="admin-tool-btn" onclick="alertAll()">📢 تنبيه عام</button>
    </div>
    
    <div style="display:flex; gap:10px;">
        <input type="text" id="user-msg" placeholder="اكتب رسالتك..." style="flex:1; background:#000; border:1px solid #333; padding:12px; border-radius:25px; color:white; outline:none;">
        <button onclick="sendMessage()" style="background:var(--gold-main); border:none; width:45px; height:45px; border-radius:50%; cursor:pointer;">➔</button>
    </div>
</div>

<div id="admin-menu">
    <div id="target-info" style="color:var(--gold-main); text-align:center; margin-bottom:10px; font-weight:bold;"></div>
    <button class="admin-btn btn-mute" onclick="manageUser('mute')">🔇 كتم مؤقت</button>
    <button class="admin-btn btn-mute" onclick="manageUser('unmute')">🔊 فك الكتم</button>
    <button class="admin-btn btn-ban" onclick="manageUser('ban')">🚫 حظر نهائي (Ban)</button>
    <button class="admin-btn btn-del" id="del-btn" onclick="manageUser('delete')">🗑️ حذف الرسالة</button>
    <button onclick="closeMenu()" style="width:100%; background:none; border:none; color:#555; margin-top:10px;">إلغاء</button>
</div>

<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>

<script>
const FOUNDER_EMAIL = "abdarahman10555@gmail.com";
const firebaseConfig = {
    apiKey: "AIzaSyBqu1IE24FhA-govU_swQ4IcynOj4AB-ao",
    authDomain: "game-zone-chat1.firebaseapp.com",
    projectId: "game-zone-chat1",
    storageBucket: "game-zone-chat1.firebasestorage.app",
    messagingSenderId: "932733239188",
    appId: "1:932733239188:web:634fbfc00a396c761a1981"
};

firebase.initializeApp(firebaseConfig);
const db = firebase.firestore();
const auth = firebase.auth();

let myProfile = null;
let selectedUID = null;
let selectedMID = null;

async function login() {
    const e = document.getElementById('email').value;
    const p = document.getElementById('pass').value;
    try {
        await auth.signInWithEmailAndPassword(e, p);
        location.reload();
    } catch {
        const r = await auth.createUserWithEmailAndPassword(e, p);
        await db.collection('users').doc(r.user.uid).set({
            uid: r.user.uid, email: e, name: e.split('@')[0], isMuted: false, isBanned: false
        });
        location.reload();
    }
}

auth.onAuthStateChanged(async user => {
    if(user) {
        const doc = await db.collection('users').doc(user.uid).get();
        myProfile = doc.data();

        if(myProfile.isBanned) {
            alert("لقد تم حظرك نهائياً من المجلس.");
            auth.signOut();
            return;
        }

        document.getElementById('login-overlay').style.display = 'none';
        if(user.email === FOUNDER_EMAIL) {
            document.getElementById('founder-tools').style.display = 'flex';
            document.getElementById('admin-indicator').innerHTML = "⚡ (المؤسس)";
        }
        loadMessages();
    }
});

function openAdmin(uid, mid, name, e) {
    if(auth.currentUser.email !== FOUNDER_EMAIL) return;
    e.preventDefault();
    selectedUID = uid; selectedMID = mid;
    document.getElementById('target-info').innerText = name;
    const m = document.getElementById('admin-menu');
    m.style.display = 'block';
    m.style.left = "20px"; m.style.top = (e.clientY - 100) + "px";
}

function closeMenu() { document.getElementById('admin-menu').style.display = 'none'; }

async function manageUser(action) {
    if(action === 'delete') {
        await db.collection('messages').doc(selectedMID).delete();
    } else if(action === 'mute') {
        await db.collection('users').doc(selectedUID).update({ isMuted: true });
    } else if(action === 'unmute') {
        await db.collection('users').doc(selectedUID).update({ isMuted: false });
    } else if(action === 'ban') {
        if(confirm("حظر نهائي؟ لن يتمكن من الدخول مرة أخرى.")) {
            await db.collection('users').doc(selectedUID).update({ isBanned: true });
        }
    }
    closeMenu();
}

async function clearAllChat() {
    if(confirm("سيتم مسح المجلس بالكامل للجميع، هل أنت متأكد؟")) {
        const snap = await db.collection('messages').get();
        const batch = db.batch();
        snap.forEach(doc => batch.delete(doc.ref));
        await batch.commit();
    }
}

async function sendMessage() {
    const input = document.getElementById('user-msg');
    const txt = input.value.trim();
    if(!txt || myProfile.isMuted) return;

    await db.collection('messages').add({
        uid: auth.currentUser.uid,
        name: myProfile.name,
        email: auth.currentUser.email,
        text: txt,
        createdAt: firebase.firestore.FieldValue.serverTimestamp()
    });
    input.value = "";
}

function loadMessages() {
    db.collection('messages').orderBy('createdAt', 'asc').limitToLast(100).onSnapshot(snap => {
        const container = document.getElementById('chat-container');
        container.innerHTML = "";
        snap.forEach(doc => {
            const m = doc.data();
            const isFounder = m.email === FOUNDER_EMAIL;
            const div = document.createElement('div');
            div.className = `message ${isFounder ? 'msg-founder' : ''}`;
            if(m.uid === auth.currentUser.uid) div.style.alignSelf = "flex-end";

            div.innerHTML = `
                <div style="font-size:0.7rem; margin-bottom:4px;">
                    ${isFounder ? '<span class="admin-badge">FOUNDER</span>' : ''}
                    <b onclick="openAdmin('${m.uid}', '${doc.id}', '${m.name}', event)" style="cursor:pointer; color:var(--gold-main);">${m.name}</b>
                </div>
                <div>${m.text}</div>
            `;
            container.appendChild(div);
        });
        container.scrollTop = container.scrollHeight;
    });
}
</script>
</body>
</html>
