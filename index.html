<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Game Zone Ultimate | التحكم الكامل</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;700;900&display=swap" rel="stylesheet">
    <style>
        /* ==========================================
           1. الأساسيات والتحكم في التمرير
           ========================================== */
        :root { 
            --bg-black: #050505; 
            --gold-main: #D4AF37; 
            --dark-card: #121212; 
            --founder-red: #ff3333;
            --text-gray: #b3b3b3;
            --radius: 15px;
        }

        * { 
            box-sizing: border-box; 
            margin: 0; padding: 0;
            -webkit-tap-highlight-color: transparent; 
        }

        html, body {
            height: 100%;
            overflow: hidden; /* لمنع اهتزاز الصفحة كاملة */
            background-color: var(--bg-black);
            font-family: 'Cairo', sans-serif;
            color: white;
        }

        /* ==========================================
           2. الهيدر (Header)
           ========================================== */
        header { 
            height: 70px;
            background: rgba(18, 18, 18, 0.98);
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
            padding: 0 20px;
            border-bottom: 2px solid var(--gold-main);
            z-index: 1000;
            box-shadow: 0 4px 20px rgba(0,0,0,0.8);
        }

        .logo { font-weight: 900; color: var(--gold-main); font-size: 1.3rem; }

        /* ==========================================
           3. منطقة الشات (Scrollable Area)
           ========================================== */
        #chat-container { 
            position: absolute;
            top: 70px;
            bottom: 85px; /* يترك مساحة لصندوق الكتابة */
            width: 100%;
            overflow-y: scroll; /* تفعيل التمرير الإجباري */
            -webkit-overflow-scrolling: touch; /* تمرير ناعم لنظام iOS */
            padding: 20px 15px;
            display: flex;
            flex-direction: column;
            gap: 15px;
            background: radial-gradient(circle at center, #111 0%, #050505 100%);
        }

        /* تنسيق شريط التمرير ليظهر بوضوح عند الحركة */
        #chat-container::-webkit-scrollbar { width: 5px; }
        #chat-container::-webkit-scrollbar-thumb { 
            background: var(--gold-main); 
            border-radius: 10px; 
        }

        /* ==========================================
           4. فقاعات الرسائل (Messages)
           ========================================== */
        .message { 
            background: rgba(255, 255, 255, 0.05); 
            padding: 12px 15px; 
            border-radius: 15px 15px 0 15px; 
            max-width: 85%; 
            border-right: 3px solid var(--gold-main);
            position: relative;
            animation: popIn 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        @keyframes popIn { from { transform: scale(0.9); opacity: 0; } to { transform: scale(1); opacity: 1; } }

        .msg-founder { 
            border: 1px solid rgba(212, 175, 55, 0.3);
            border-right: 5px solid var(--founder-red);
            background: rgba(255, 0, 0, 0.02);
        }

        .user-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 5px;
            font-size: 0.75rem;
        }

        .rank-tag { cursor: pointer; font-weight: bold; transition: 0.2s; }
        .rank-tag:hover { text-decoration: underline; color: var(--gold-main); }

        .reply-box-in-msg {
            background: rgba(0,0,0,0.3);
            padding: 5px 10px;
            border-radius: 8px;
            margin-bottom: 8px;
            border-right: 2px solid #555;
            font-size: 0.7rem;
            color: #aaa;
        }

        /* ==========================================
           5. منطقة التحكم السفلية (Controls)
           ========================================== */
        .footer-fixed {
            position: fixed;
            bottom: 0;
            width: 100%;
            background: var(--dark-card);
            z-index: 2000;
        }

        #reply-bar {
            background: #1a1a1a;
            padding: 8px 20px;
            border-top: 1px solid var(--gold-main);
            display: none;
            justify-content: space-between;
            align-items: center;
            font-size: 0.8rem;
        }

        .input-group {
            display: flex;
            padding: 15px;
            gap: 10px;
            align-items: center;
            padding-bottom: calc(15px + env(safe-area-inset-bottom));
        }

        input#user-msg {
            flex: 1;
            background: #000;
            border: 1px solid #333;
            padding: 12px 18px;
            border-radius: 25px;
            color: white;
            outline: none;
            font-size: 16px;
        }

        input#user-msg:focus { border-color: var(--gold-main); }

        .send-btn {
            background: var(--gold-main);
            width: 45px; height: 45px;
            border-radius: 50%;
            border: none;
            display: flex; align-items: center; justify-content: center;
            cursor: pointer;
            box-shadow: 0 4px 10px rgba(212, 175, 55, 0.3);
        }

        /* ==========================================
           6. لوحة التحكم (Admin Menu)
           ========================================== */
        #admin-menu {
            position: fixed;
            background: #181818;
            border: 1px solid var(--gold-main);
            border-radius: 12px;
            padding: 10px;
            display: none;
            z-index: 9999;
            width: 200px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.9);
        }

        #admin-menu button {
            width: 100%;
            padding: 10px;
            margin: 5px 0;
            background: #252525;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            text-align: right;
            font-family: 'Cairo';
            font-size: 0.85rem;
        }

        #admin-menu button.delete-btn { color: var(--founder-red); font-weight: bold; }
        #admin-menu button:hover { background: #333; }

        /* نظام التنبيهات */
        #alert-box {
            position: fixed; top: 20px; left: 50%; transform: translateX(-50%);
            background: var(--gold-main); color: black; padding: 10px 25px;
            border-radius: 50px; font-weight: bold; z-index: 10000; display: none;
        }

        /* شاشة الدخول */
        #login-screen {
            position: fixed; inset: 0; background: #000; z-index: 10000;
            display: flex; justify-content: center; align-items: center;
        }
        .login-box {
            background: var(--dark-card); padding: 40px; border-radius: 20px;
            border: 1px solid var(--gold-main); width: 90%; max-width: 350px; text-align: center;
        }
    </style>
</head>
<body>

<div id="alert-box"></div>

<div id="admin-menu">
    <div id="menu-title" style="font-size: 0.7rem; color: #888; text-align: center; margin-bottom: 8px;"></div>
    <button onclick="handleAdmin('mute')">🔇 كتم العضو</button>
    <button onclick="handleAdmin('unmute')">🔊 فك الكتم</button>
    <button class="delete-btn" id="del-btn-ui" style="display:none;" onclick="handleAdmin('delete')">🗑️ حذف الرسالة</button>
    <button onclick="closeMenu()" style="color: #666; margin-top: 5px;">إغلاق</button>
</div>

<div id="login-screen">
    <div class="login-box">
        <h2 style="color:var(--gold-main); margin-bottom: 20px;">GAME ZONE CHAT</h2>
        <input type="email" id="email" placeholder="البريد الإلكتروني" style="width:100%; padding:12px; margin-bottom:10px; border-radius:8px; border:1px solid #333; background:#000; color:white;"><br>
        <input type="password" id="pass" placeholder="كلمة السر" style="width:100%; padding:12px; margin-bottom:20px; border-radius:8px; border:1px solid #333; background:#000; color:white;"><br>
        <button onclick="login()" style="width:100%; padding:12px; background:var(--gold-main); border:none; border-radius:8px; font-weight:bold; cursor:pointer;">دخول</button>
    </div>
</div>

<header>
    <div class="logo">Game Zone <small style="font-size:0.6rem; vertical-align:middle; opacity:0.7;">PRO</small></div>
    <div id="user-rank-display" style="font-size: 0.8rem;"></div>
</header>

<div id="chat-container"></div>

<div class="footer-fixed">
    <div id="reply-bar">
        <div id="reply-text" style="color: #aaa; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 80%;"></div>
        <div onclick="cancelReply()" style="color: var(--founder-red); cursor: pointer; padding: 0 10px; font-weight: bold;">✕</div>
    </div>
    
    <div class="input-group">
        <input type="text" id="user-msg" placeholder="اكتب رسالتك هنا..." autocomplete="off">
        <button class="send-btn" onclick="sendMessage()">
            <svg viewBox="0 0 24 24" width="20" height="20" fill="black"><path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"></path></svg>
        </button>
    </div>
</div>

<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>

<script>
// ==========================================
// 1. الإعدادات والتحقق
// ==========================================
const FOUNDER_EMAIL = "abdarahman10555@gmail.com";
const firebaseConfig = {
    apiKey: "AIzaSyBqu1IE24FhA-govU_swQ4IcynOj4AB-ao",
    authDomain: "game-zone-chat1.firebaseapp.com",
    projectId: "game-zone-chat1",
    storageBucket: "game-zone-chat1.firebasestorage.app",
    messagingSenderId: "932733239188",
    appId: "1:932733239188:web:634fbfc00a396c761a1981"
};

firebase.initializeApp(firebaseConfig);
const db = firebase.firestore();
const auth = firebase.auth();

let myProfile = null;
let replyData = null;
let targetUID = null;
let targetMsgID = null;

// ==========================================
// 2. وظائف النظام الأساسية
// ==========================================
function showAlert(m) {
    const b = document.getElementById('alert-box');
    b.innerText = m; b.style.display = 'block';
    setTimeout(() => b.style.display = 'none', 3000);
}

function closeMenu() { document.getElementById('admin-menu').style.display = 'none'; }

async function login() {
    const e = document.getElementById('email').value;
    const p = document.getElementById('pass').value;
    try {
        await auth.signInWithEmailAndPassword(e, p);
    } catch {
        const r = await auth.createUserWithEmailAndPassword(e, p);
        await db.collection('users').doc(r.user.uid).set({
            uid: r.user.uid, email: e, name: e.split('@')[0],
            isMuted: false, joinedAt: firebase.firestore.FieldValue.serverTimestamp()
        });
    }
    location.reload();
}

auth.onAuthStateChanged(async user => {
    if (user) {
        const d = await db.collection('users').doc(user.uid).get();
        myProfile = d.data();
        document.getElementById('login-screen').style.display = 'none';
        
        // عرض رتبة المستخدم في الهيدر
        const isF = user.email === FOUNDER_EMAIL;
        document.getElementById('user-rank-display').innerHTML = isF ? 
            '<span style="color:red; font-weight:900;">المؤسس ⚡</span>' : 
            '<span style="color:#888;">عضو النشط 🔥</span>';
            
        loadMessages();
    }
});

// ==========================================
// 3. إدارة الرسائل والتحكم
// ==========================================
function openMenu(uid, msgId, name, e) {
    e.preventDefault();
    targetUID = uid;
    targetMsgID = msgId;
    const menu = document.getElementById('admin-menu');
    document.getElementById('menu-title').innerText = "العضو: " + name;
    
    // إظهار زر الحذف فقط للمؤسس
    if(auth.currentUser.email === FOUNDER_EMAIL) {
        document.getElementById('del-btn-ui').style.display = 'block';
    }

    menu.style.display = 'block';
    menu.style.left = "20px";
    menu.style.top = e.clientY > window.innerHeight - 200 ? (e.clientY - 150) + "px" : e.clientY + "px";
}

async function handleAdmin(action) {
    if(action === 'delete') {
        if(confirm("هل تريد حذف هذه الرسالة نهائياً؟")) {
            await db.collection('messages').doc(targetMsgID).delete();
            showAlert("تم حذف الرسالة");
        }
    } else if (action === 'mute' || action === 'unmute') {
        if(auth.currentUser.email !== FOUNDER_EMAIL) return showAlert("صلاحية للمؤسس فقط");
        await db.collection('users').doc(targetUID).update({ isMuted: action === 'mute' });
        showAlert(action === 'mute' ? "تم الكتم" : "تم فك الكتم");
    }
    closeMenu();
}

function setReply(name, text) {
    replyData = { name, text };
    document.getElementById('reply-text').innerText = "رداً على " + name + ": " + text;
    document.getElementById('reply-bar').style.display = 'flex';
    document.getElementById('user-msg').focus();
}

function cancelReply() {
    replyData = null;
    document.getElementById('reply-bar').style.display = 'none';
}

async function sendMessage() {
    const input = document.getElementById('user-msg');
    const text = input.value.trim();
    if(!text || myProfile.isMuted) return;

    await db.collection('messages').add({
        uid: auth.currentUser.uid,
        name: myProfile.name,
        email: auth.currentUser.email,
        text: text,
        reply: replyData,
        createdAt: firebase.firestore.FieldValue.serverTimestamp()
    });

    input.value = "";
    cancelReply();
}

function loadMessages() {
    db.collection('messages').orderBy('createdAt', 'asc').limitToLast(50).onSnapshot(snap => {
        const container = document.getElementById('chat-container');
        container.innerHTML = "";
        
        snap.forEach(doc => {
            const m = doc.data();
            const isF = m.email === FOUNDER_EMAIL;
            const isMe = m.uid === auth.currentUser.uid;
            
            const div = document.createElement('div');
            div.className = `message ${isF ? 'msg-founder' : ''}`;
            if(isMe) div.style.alignSelf = "flex-end";
            if(isMe) div.style.borderRadius = "15px 15px 15px 0";

            let replyHTML = m.reply ? `<div class="reply-box-in-msg">↩ ${m.reply.name}: ${m.reply.text.substring(0,25)}</div>` : '';

            div.innerHTML = `
                ${replyHTML}
                <div class="user-header">
                    <span class="rank-tag" onclick="openMenu('${m.uid}', '${doc.id}', '${m.name}', event)">${m.name}</span>
                    <span style="opacity:0.5; font-size:0.6rem;" onclick="setReply('${m.name}', '${m.text}')">رد</span>
                </div>
                <div style="word-break:break-word;">${m.text}</div>
            `;
            container.appendChild(div);
        });
        // التمرير التلقائي لأسفل عند وصول رسالة جديدة
        container.scrollTop = container.scrollHeight;
    });
}

// إغلاق القوائم عند لمس الشاشة
document.getElementById('chat-container').addEventListener('click', closeMenu);
</script>
</body>
</html>
