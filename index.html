<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>GAME ZONE | ULTIMATE</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap');
        :root { --gold: #D4AF37; --dark-bg: #050505; --panel: #111; }
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Cairo', sans-serif; outline: none; }
        body { background: var(--dark-bg); color: #fff; height: 100vh; overflow: hidden; display: flex; }

        .overlay { position: fixed; inset: 0; background: var(--dark-bg); z-index: 10000; display: flex; justify-content: center; align-items: center; padding: 20px; }
        .win-box { background: var(--panel); border: 2px solid var(--gold); padding: 25px; border-radius: 15px; width: 100%; max-width: 350px; text-align: center; box-shadow: 0 0 20px rgba(212, 175, 55, 0.2); }
        input { width: 100%; padding: 14px; margin-bottom: 15px; background: #000; border: 1px solid #333; color: #fff; border-radius: 10px; text-align: center; }

        #app { display: none; width: 100%; height: 100vh; flex-direction: row-reverse; }
        .sidebar { width: 280px; background: #000; border-left: 2px solid var(--gold); display: flex; flex-direction: column; transition: 0.3s; }
        .chat-main { flex: 1; display: flex; flex-direction: column; background: #080808; position: relative; }

        .rank { font-size: 0.55rem; padding: 2px 6px; border-radius: 4px; font-weight: bold; margin-left: 5px; color: white; vertical-align: middle; }
        .r-founder { background: #ff3e3e; } .r-legend { background: #a333c8; } .r-active { background: #2185d0; } .r-new { background: #767676; }

        .msg-area { flex: 1; overflow-y: auto; padding: 15px; display: flex; flex-direction: column; gap: 15px; }
        .bubble { max-width: 85%; padding: 12px; border-radius: 15px; position: relative; font-size: 0.95rem; border: 1px solid #222; }
        .bubble.me { align-self: flex-end; background: var(--gold); color: #000; }
        .bubble.user { align-self: flex-start; background: #1a1a1a; border-right: 4px solid var(--gold); }

        .header { padding: 12px; background: #000; border-bottom: 2px solid var(--gold); display: flex; justify-content: space-between; align-items: center; }
        .input-bar { padding: 12px; background: #000; display: flex; gap: 10px; border-top: 1px solid #222; }
        .btn-gold { background: var(--gold); border: none; padding: 12px 25px; border-radius: 10px; font-weight: 900; cursor: pointer; color: black; }

        @media (max-width: 768px) { .sidebar { position: absolute; right: -100%; height: 100%; z-index: 1001; } .sidebar.open { right: 0; } }
    </style>
</head>
<body>

<div id="auth-screen" class="overlay">
    <div class="win-box">
        <h2 style="color:var(--gold); font-weight: 900;">GAME ZONE</h2><br>
        <input type="email" id="email" placeholder="البريد الإلكتروني">
        <input type="password" id="pass" placeholder="كلمة السر">
        <button class="btn-gold" style="width:100%" onclick="login()">دخول</button>
    </div>
</div>

<div id="nick-screen" class="overlay" style="display:none">
    <div class="win-box">
        <h3 style="color:var(--gold)">اختر اسمك المستعار</h3><br>
        <input type="text" id="nickInput" placeholder="اكتب اسمك هنا...">
        <button class="btn-gold" id="saveNickBtn" style="width:100%" onclick="updateNickname()">حفظ والبدء</button>
    </div>
</div>

<div id="app">
    <aside class="sidebar" id="adminSidebar">
        <div style="padding:20px; border-bottom:1px solid #222; text-align:center; color:var(--gold); font-weight:bold">لوحة الإدارة</div>
        <div id="userList" style="flex:1; overflow-y:auto"></div>
        <button onclick="clearChat()" style="background:#ff3e3e; color:white; border:none; padding:15px; font-weight:bold; cursor:pointer">تطهير الشات</button>
    </aside>

    <main class="chat-main">
        <header class="header">
            <button onclick="document.getElementById('adminSidebar').classList.toggle('open')" id="adminIcon" style="background:none; border:none; color:var(--gold); display:none"><i class="fas fa-users-cog fa-lg"></i></button>
            <div style="text-align:center">
                <div id="displayNick" style="font-weight:900; color: var(--gold);"></div>
            </div>
            <i class="fas fa-sign-out-alt fa-lg" onclick="auth.signOut(); location.reload()" style="cursor:pointer; color:#555"></i>
        </header>
        <div class="msg-area" id="msgBox"></div>
        <footer class="input-bar">
            <input type="text" id="msgInput" placeholder="اكتب رسالة...">
            <button class="btn-gold" onclick="send()"><i class="fas fa-paper-plane"></i></button>
        </footer>
    </main>
</div>

<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>

<script>
const FOUNDER_ID = "abdarahman10555@gmail.com";
const firebaseConfig = {
    apiKey: "AIzaSyBqu1IE24FhA-govU_swQ4IcynOj4AB-ao",
    authDomain: "game-zone-chat1.firebaseapp.com",
    projectId: "game-zone-chat1",
    storageBucket: "game-zone-chat1.firebasestorage.app",
    messagingSenderId: "932733239188",
    appId: "1:932733239188:web:634fbfc00a396c761a1981"
};

firebase.initializeApp(firebaseConfig);
const db = firebase.firestore();
const auth = firebase.auth();
let myData = null;

function getRank(joinDate, email) {
    if (email === FOUNDER_ID) return { n: "FOUNDER", c: "r-founder" };
    return { n: "MEMBER", c: "r-new" };
}

async function login() {
    const e = document.getElementById('email').value.trim();
    const p = document.getElementById('pass').value.trim();
    try { await auth.signInWithEmailAndPassword(e, p); } 
    catch { await auth.createUserWithEmailAndPassword(e, p); }
}

auth.onAuthStateChanged(async user => {
    if(user) {
        document.getElementById('auth-screen').style.display = 'none';
        
        // محاولة جلب الاسم من الذاكرة المحلية أولاً لتجنب التعليق
        const localName = localStorage.getItem('chat_nick_' + user.email);
        
        const doc = await db.collection('users').doc(user.email).get();
        if(!doc.exists && !localName) {
            document.getElementById('nick-screen').style.display = 'flex';
        } else {
            myData = doc.exists ? doc.data() : { name: localName, email: user.email };
            startApp();
        }
    }
});

async function updateNickname() {
    const name = document.getElementById('nickInput').value.trim();
    if(!name) return;

    const user = auth.currentUser;
    // حفظ في الذاكرة المحلية فوراً لضمان الدخول
    localStorage.setItem('chat_nick_' + user.email, name);
    
    myData = { name: name, email: user.email, joinDate: firebase.firestore.FieldValue.serverTimestamp() };
    
    // محاولة الحفظ في قاعدة البيانات (حتى لو فشلت سيدخل المستخدم)
    db.collection('users').doc(user.email).set(myData, {merge: true}).catch(e => console.log("DB Sync pending..."));

    document.getElementById('nick-screen').style.display = 'none';
    startApp();
}

function startApp() {
    document.getElementById('app').style.display = 'flex';
    document.getElementById('displayNick').innerText = myData.name;
    if(auth.currentUser.email === FOUNDER_ID) document.getElementById('adminIcon').style.display = 'block';
    loadMessages();
}

async function send() {
    const inp = document.getElementById('msgInput');
    if(!inp.value.trim() || !myData) return;
    
    db.collection('messages').add({
        text: inp.value,
        sender: myData.email,
        name: myData.name,
        time: firebase.firestore.FieldValue.serverTimestamp()
    }).catch(e => alert("فشل الإرسال: تأكد من صلاحيات Firebase Rules"));
    inp.value = "";
}

document.getElementById('msgInput').addEventListener('keypress', e => { if (e.key === 'Enter') send(); });

function loadMessages() {
    db.collection('messages').orderBy('time').limitToLast(30).onSnapshot(snap => {
        const box = document.getElementById('msgBox');
        box.innerHTML = "";
        snap.forEach(doc => {
            const m = doc.data();
            const r = getRank(null, m.sender);
            const isMe = m.sender === auth.currentUser.email;
            const div = document.createElement('div');
            div.className = `bubble ${isMe ? 'me' : 'user'}`;
            div.innerHTML = `<div style="font-size:0.6rem; font-weight:bold"><span class="rank ${r.c}">${r.n}</span> ${m.name}</div><div>${m.text}</div>`;
            box.appendChild(div);
        });
        box.scrollTop = box.scrollHeight;
    });
}
</script>
</body>
</html>
