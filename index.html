<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>GAME ZONE | GOLDEN OS</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap');

        :root {
            --gold: #D4AF37;
            --dark-gold: #996515;
            --bg-black: #0a0a0a;
            --win-gray: #1a1a1a;
            --text-gray: #b0b0b0;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Cairo', sans-serif; }
        body { background: var(--bg-black); color: white; height: 100vh; overflow: hidden; display: flex; flex-direction: column; }

        /* شاشة الدخول الفاخرة */
        #auth-overlay { position: fixed; inset: 0; background: var(--bg-black); z-index: 10000; display: flex; justify-content: center; align-items: center; padding: 20px; }
        .gold-window { background: var(--win-gray); border: 2px solid var(--gold); border-radius: 8px; box-shadow: 0 0 20px rgba(212, 175, 55, 0.2); width: 100%; max-width: 350px; }
        .gold-header { background: var(--gold); color: black; padding: 8px 15px; font-weight: 900; font-size: 0.9rem; text-align: center; border-radius: 5px 5px 0 0; }
        .gold-body { padding: 25px; }

        input { width: 100%; padding: 12px; background: #000; border: 1px solid var(--dark-gold); color: var(--gold); margin-bottom: 15px; border-radius: 4px; font-size: 0.9rem; }
        .btn-gold { width: 100%; padding: 12px; background: var(--gold); color: black; border: none; font-weight: bold; cursor: pointer; transition: 0.3s; border-radius: 4px; }
        .btn-gold:hover { background: white; box-shadow: 0 0 15px var(--gold); }

        /* الشات الرئيسي */
        #app { display: none; flex-direction: column; height: 100vh; }
        .main-header { padding: 10px 20px; border-bottom: 2px solid var(--gold); display: flex; justify-content: space-between; align-items: center; background: #000; }
        
        .chat-area { flex: 1; overflow-y: auto; padding: 15px; background: radial-gradient(circle, #151515 0%, #050505 100%); display: flex; flex-direction: column; gap: 15px; }

        /* تصميم رسائل المحادثة الجديد */
        .msg-container { display: flex; flex-direction: column; max-width: 85%; }
        .msg-container.me { align-self: flex-end; }
        .msg-container.user { align-self: flex-start; }

        .user-info { font-size: 0.75rem; color: var(--gold); margin-bottom: 4px; font-weight: bold; display: flex; align-items: center; gap: 6px; }
        
        .bubble { 
            padding: 12px 16px; 
            border-radius: 12px; 
            font-size: 0.95rem; 
            line-height: 1.6; 
            position: relative;
            word-wrap: break-word;
            border: 1px solid rgba(212, 175, 55, 0.3);
        }
        .user .bubble { background: #1a1a1a; color: #fff; border-bottom-right-radius: 2px; }
        .me .bubble { background: var(--gold); color: black; border-bottom-left-radius: 2px; font-weight: 500; }

        /* الرتب */
        .rank-pill { font-size: 0.6rem; padding: 2px 6px; border-radius: 3px; border: 1px solid var(--gold); text-transform: uppercase; }
        .founder-rank { background: gold; color: black; box-shadow: 0 0 10px gold; }
        .legend-rank { border-color: #ff00ff; color: #ff00ff; }
        .active-rank { border-color: #00d4ff; color: #00d4ff; }

        /* منطقة الكتابة */
        .input-bar { padding: 15px; background: #000; border-top: 2px solid var(--gold); display: flex; gap: 10px; align-items: center; }
        #messageInput { flex: 1; margin-bottom: 0; border-radius: 25px; padding: 12px 20px; }
        .send-btn { background: var(--gold); border: none; width: 45px; height: 45px; border-radius: 50%; color: black; cursor: pointer; display: flex; justify-content: center; align-items: center; }

        /* بطاقة العضو عند الضغط */
        #member-card { position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); z-index: 10001; display: none; }
    </style>
</head>
<body>

<div id="auth-overlay">
    <div class="gold-window" id="login-screen">
        <div class="gold-header">ACCESS GRANTED | GAME ZONE</div>
        <div class="gold-body">
            <input type="email" id="email" placeholder="البريد الإلكتروني">
            <input type="password" id="pass" placeholder="كلمة السر">
            <button class="btn-gold" onclick="authSystem()">LOGIN TO SYSTEM</button>
        </div>
    </div>
    <div class="gold-window" id="nick-screen" style="display: none;">
        <div class="gold-header">IDENTITY SETUP</div>
        <div class="gold-body">
            <input type="text" id="nickInput" placeholder="الاسم المستعار (Nickname)">
            <button class="btn-gold" onclick="saveNick()">INITIALIZE</button>
        </div>
    </div>
</div>

<div id="app">
    <header class="main-header">
        <h2 style="color: var(--gold); font-size: 1.1rem; letter-spacing: 2px;">GOLDEN <span style="color:white">TERMINAL</span></h2>
        <i class="fas fa-power-off" onclick="auth.signOut(); location.reload();" style="color: var(--gold); cursor:pointer;"></i>
    </header>

    <main class="chat-area" id="msgBox"></main>

    <footer class="input-bar">
        <input type="text" id="messageInput" placeholder="اكتب رسالتك المشفرة...">
        <button class="send-btn" onclick="sendMessage()"><i class="fas fa-paper-plane"></i></button>
    </footer>
</div>

<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>

<script>
const FOUNDER_ID = "abdarahman10555@gmail.com";
const firebaseConfig = {
    apiKey: "AIzaSyBqu1IE24FhA-govU_swQ4IcynOj4AB-ao",
    authDomain: "game-zone-chat1.firebaseapp.com",
    projectId: "game-zone-chat1",
    storageBucket: "game-zone-chat1.firebasestorage.app",
    messagingSenderId: "932733239188",
    appId: "1:932733239188:web:634fbfc00a396c761a1981"
};

firebase.initializeApp(firebaseConfig);
const db = firebase.firestore();
const auth = firebase.auth();

function getRank(joinDate, email) {
    if (email === FOUNDER_ID) return { n: "FOUNDER", c: "founder-rank" };
    if (!joinDate) return { n: "NEW", c: "" };
    const days = Math.floor((new Date() - joinDate.toDate()) / (1000 * 60 * 60 * 24));
    if (days >= 30) return { n: "LEGEND", c: "legend-rank" };
    if (days >= 3) return { n: "ACTIVE", c: "active-rank" };
    return { n: "NEW", c: "" };
}

async function authSystem() {
    const e = document.getElementById('email').value;
    const p = document.getElementById('pass').value;
    try { await auth.signInWithEmailAndPassword(e, p); } 
    catch { await auth.createUserWithEmailAndPassword(e, p); }
}

auth.onAuthStateChanged(async user => {
    if(user) {
        document.getElementById('login-screen').style.display = 'none';
        const doc = await db.collection('users').doc(user.email).get();
        if(!doc.exists) document.getElementById('nick-screen').style.display = 'block';
        else startApp();
    }
});

async function saveNick() {
    const n = document.getElementById('nickInput').value;
    if(!n) return;
    await db.collection('users').doc(auth.currentUser.email).set({
        nickname: n, joinDate: firebase.firestore.FieldValue.serverTimestamp(), email: auth.currentUser.email
    });
    startApp();
}

function startApp() {
    document.getElementById('auth-overlay').style.display = 'none';
    document.getElementById('app').style.display = 'flex';
    listenMessages();
}

async function sendMessage() {
    const inp = document.getElementById('messageInput');
    if(!inp.value.trim()) return;
    const userDoc = await db.collection('users').doc(auth.currentUser.email).get();
    const u = userDoc.data();
    await db.collection('messages').add({
        text: inp.value, sender: u.email, nickname: u.nickname,
        joinDate: u.joinDate, time: firebase.firestore.FieldValue.serverTimestamp()
    });
    inp.value = "";
}

function listenMessages() {
    db.collection('messages').orderBy('time').onSnapshot(snap => {
        const box = document.getElementById('msgBox');
        box.innerHTML = "";
        snap.forEach(doc => {
            const m = doc.data();
            const rank = getRank(m.joinDate, m.sender);
            const isMe = m.sender === auth.currentUser.email;
            
            const msgHtml = `
                <div class="msg-container ${isMe ? 'me' : 'user'}">
                    <div class="user-info" onclick="alert('👤 ${m.nickname}\\n🏆 رتبة: ${rank.n}')">
                        <span class="rank-pill ${rank.c}">${rank.n}</span>
                        ${m.nickname}
                    </div>
                    <div class="bubble">${m.text}</div>
                </div>
            `;
            box.insertAdjacentHTML('beforeend', msgHtml);
        });
        box.scrollTop = box.scrollHeight;
    });
}
document.getElementById('messageInput').addEventListener('keypress', e => { if(e.key==='Enter') sendMessage(); });
</script>
</body>
</html>
