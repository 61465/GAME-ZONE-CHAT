<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>GAME ZONE | PRO v5</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<style>
@import url('https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap');
:root { --gold:#D4AF37; --dark-bg:#050505; --panel:#111; }
* { margin:0; padding:0; box-sizing:border-box; font-family:'Cairo',sans-serif; outline:none; }
body { background:var(--dark-bg); color:#fff; height:100dvh; overflow:hidden; display:flex; flex-direction:column; }

/* شاشات الدخول */
.overlay { position:fixed; inset:0; background:var(--dark-bg); z-index:10000; display:flex; justify-content:center; align-items:center; padding:20px; }
.win-box { background:var(--panel); border:2px solid var(--gold); padding:25px; border-radius:15px; width:100%; max-width:350px; text-align:center; }
input { width:100%; padding:12px; margin-bottom:15px; background:#000; border:1px solid #333; color:#fff; border-radius:8px; }

/* التطبيق */
#app { display:none; width:100%; height:100%; flex:1; flex-direction:row-reverse; overflow:hidden; }

/* القائمة الجانبية */
.sidebar { width:280px; background:#000; border-left:2px solid var(--gold); display:flex; flex-direction:column; transition:.3s; z-index:1001; }
.sidebar.open { right:0; }

/* الشات */
.chat-main { flex:1; display:flex; flex-direction:column; background:#080808; min-height:0; position:relative; }

/* الهيدر */
.header { padding:10px; background:#000; border-bottom:1px solid var(--gold); display:flex; justify-content:space-between; align-items:center; }

/* الرسائل */
.msg-area { flex:1; overflow-y:auto; padding:15px; display:flex; flex-direction:column; gap:10px; min-height:0; scroll-behavior:smooth; }

/* فقاعات */
.bubble { max-width:80%; padding:10px; border-radius:18px; position:relative; font-size:.9rem; word-wrap:break-word; line-height:1.3; transition:.2s; }
.bubble.me { align-self:flex-end; background:var(--gold); color:#000; border-bottom-right-radius:4px; }
.bubble.user { align-self:flex-start; background:#1a1a1a; border-right:3px solid var(--gold); border-bottom-left-radius:4px; }
.bubble.system { align-self:center; background:rgba(212,175,55,0.1); border:1px dashed var(--gold); color:var(--gold); font-size:.75rem; text-align:center; }

/* الردود */
.reply-box { background:rgba(0,0,0,0.2); padding:5px; border-radius:4px; font-size:.75rem; margin-bottom:5px; border-right:2px solid #555; }

/* الرتب */
.rank { font-size:.55rem; padding:2px 6px; border-radius:4px; font-weight:bold; margin-left:5px; color:white; }
.r-founder{background:red;} .r-legend{background:purple;} .r-active{background:blue;} .r-new{background:#666;} .r-system{background:var(--gold); color:black;}

/* شريط الإدخال */
.input-bar { background:#000; padding:10px; border-top:1px solid #222; display:flex; flex-direction:column; position:sticky; bottom:0; z-index:20; }
.input-row { display:flex; gap:10px; }
#msgInput { resize:none; max-height:150px; overflow-y:auto; line-height:1.4; padding:10px; font-size:.95rem; border-radius:8px; background:#000; border:1px solid #333; color:#fff; flex:1; }
.btn-gold { background:var(--gold); border:none; padding:10px 18px; border-radius:8px; font-weight:bold; cursor:pointer; color:black; }

/* الرد المعروض */
#reply-preview { background:#222; padding:8px; border-right:3px solid var(--gold); display:none; justify-content:space-between; align-items:center; margin-bottom:6px; border-radius:4px; }

/* responsive */
@media (max-width:768px){
  .sidebar { position:absolute; right:-100%; height:100%; z-index:1001; }
  .sidebar.open { right:0; }
  #msgInput{font-size:1rem; padding:12px;}
  .btn-gold{padding:10px 14px;}
}
</style>
</head>

<body>
<div id="auth-screen" class="overlay">
  <div class="win-box">
    <h2 style="color:var(--gold)">GAME ZONE</h2><br>
    <input type="email" id="email" placeholder="الإيميل">
    <input type="password" id="pass" placeholder="كلمة السر">
    <button class="btn-gold" style="width:100%" onclick="login()">دخول / تسجيل</button>
  </div>
</div>

<div id="nick-screen" class="overlay" style="display:none">
  <div class="win-box">
    <h3 style="color:var(--gold)">اختر اسمك المستعار</h3><br>
    <input type="text" id="nickInput" placeholder="اكتب اسمك هنا...">
    <button class="btn-gold" style="width:100%" onclick="updateNickname()">حفظ والبدء</button>
  </div>
</div>

<div id="app">
<aside class="sidebar" id="adminSidebar">
  <div style="padding:15px; border-bottom:1px solid #222; text-align:center; color:var(--gold); font-weight:bold">لوحة المؤسس</div>
  <div id="userList" style="flex:1; overflow-y:auto"></div>
  <button onclick="clearChat()" style="background:red; color:white; border:none; padding:15px; font-weight:bold; cursor:pointer">تطهير الشات</button>
</aside>

<main class="chat-main">
<header class="header">
  <button onclick="document.getElementById('adminSidebar').classList.toggle('open')" id="adminIcon" style="background:none; border:none; color:var(--gold); display:none"><i class="fas fa-users-cog fa-lg"></i></button>
  <div style="text-align:center">
    <div id="displayNick" style="font-weight:bold; font-size:.9rem;"></div>
    <div onclick="document.getElementById('nick-screen').style.display='flex'" style="font-size:.6rem; color:var(--gold); cursor:pointer">تغيير الاسم <i class="fas fa-edit"></i></div>
  </div>
  <i class="fas fa-sign-out-alt" onclick="auth.signOut().then(()=>location.reload())" style="cursor:pointer; color:#666"></i>
</header>

<div class="msg-area" id="msgBox"></div>

<footer class="input-bar">
<div id="reply-preview">
  <div id="reply-text" style="font-size:.7rem; color:#aaa"></div>
  <i class="fas fa-times" onclick="cancelReply()" style="cursor:pointer; color:red"></i>
</div>
<div class="input-row">
  <button class="btn-gold" onclick="sendPhoto()" title="إرسال صورة"><i class="fas fa-image"></i></button>
  <textarea id="msgInput" placeholder="اكتب رسالة..." rows="1"></textarea>
  <button class="btn-gold" onclick="send()"><i class="fas fa-paper-plane"></i></button>
</div>
</footer>
</main>
</div>

<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>

<script>
const FOUNDER_ID = "abdarahman10555@gmail.com";
const firebaseConfig = { apiKey:"AIzaSyBqu1IE24FhA-govU_swQ4IcynOj4AB-ao", authDomain:"game-zone-chat1.firebaseapp.com", projectId:"game-zone-chat1", storageBucket:"game-zone-chat1.firebasestorage.app", messagingSenderId:"932733239188", appId:"1:932733239188:web:634fbfc00a396c761a1981" };
firebase.initializeApp(firebaseConfig);
const db=firebase.firestore();
const auth=firebase.auth();
let myData=null,isMuted=false,replyData=null;

function getRank(joinDate,email){ if(email==="SYSTEM") return {n:"نظام",c:"r-system"}; if(email===FOUNDER_ID) return {n:"مؤسس",c:"r-founder"}; if(!joinDate) return {n:"جديد",c:"r-new"}; const date=joinDate.toDate?joinDate.toDate():new Date(joinDate); const days=Math.floor((new Date()-date)/(1000*60*60*24)); if(days>=30)return {n:"أسطورة",c:"r-legend"}; if(days>=3)return {n:"نشط",c:"r-active"}; return {n:"جديد",c:"r-new"};}

async function login(){ const e=document.getElementById('email').value.trim(); const p=document.getElementById('pass').value; if(!e||!p)return alert("يرجى ملء البيانات"); try{ await auth.signInWithEmailAndPassword(e,p); } catch(err){ try{ await auth.createUserWithEmailAndPassword(e,p);}catch(regErr){alert(regErr.message);} } }

auth.onAuthStateChanged(async user=>{ if(user){ const banDoc=await db.collection('bans').doc(user.email).get(); if(banDoc.exists){alert("أنت محظور!"); auth.signOut(); return;} db.collection('mutes').doc(user.email).onSnapshot(doc=>{ isMuted=doc.exists; document.getElementById('msgInput').placeholder=isMuted?"أنت مكتوم حالياً":"اكتب رسالة..."; }); const doc=await db.collection('users').doc(user.email).get(); if(!doc.exists){ document.getElementById('auth-screen').style.display='none'; document.getElementById('nick-screen').style.display='flex'; }else{ myData=doc.data(); showApp(); } } });

async function updateNickname(){ const n=document.getElementById('nickInput').value.trim(); if(!n)return; const user=auth.currentUser; const data={name:n,email:user.email,joinDate:firebase.firestore.FieldValue.serverTimestamp()}; await db.collection('users').doc(user.email).set(data,{merge:true}); await db.collection('messages').add({ text:`انضم المحارب الجديد ${n} إلى GAME ZONE! ⚔️`, sender:"SYSTEM", name:"النظام", time:firebase.firestore.FieldValue.serverTimestamp() }); const updatedDoc=await db.collection('users').doc(user.email).get(); myData=updatedDoc.data(); document.getElementById('nick-screen').style.display='none'; showApp(); }

function showApp(){ document.getElementById('auth-screen').style.display='none'; document.getElementById('app').style.display='flex'; document.getElementById('displayNick').innerText=myData.name; if(auth.currentUser.email===FOUNDER_ID){ document.getElementById('adminIcon').style.display='block'; loadAdminPanel(); } loadMessages(); }

function setReply(name,text){ replyData={name,text}; document.getElementById('reply-text').innerText=`الرد على ${name}: ${text.substring(0,20)}...`; document.getElementById('reply-preview').style.display='flex'; }
function cancelReply(){ replyData=null; document.getElementById('reply-preview').style.display='none'; }

async function sendPhoto(){ const url=prompt("أدخل رابط الصورة المباشر:"); if(!url||isMuted)return; try{ await db.collection('messages').add({ image:url, sender:myData.email, name:myData.name, joinDate:myData.joinDate||null, time:firebase.firestore.FieldValue.serverTimestamp() }); } catch(e){alert("خطأ في الإرسال");} }

async function send(){ const inp=document.getElementById('msgInput'); const msgText=inp.value.trim(); if(!msgText||isMuted)return; try{ await db.collection('messages').add({ text:msgText, sender:myData.email, name:myData.name, reply:replyData, joinDate:myData.joinDate||null, time:firebase.firestore.FieldValue.serverTimestamp() }); inp.value=""; cancelReply(); scrollToBottom(50); } catch(error){alert("خطأ في الإرسال");} }

document.getElementById('msgInput').addEventListener('keydown', e=>{ if(e.key==='Enter'){ e.preventDefault(); send(); }});

function loadMessages(){ db.collection('messages').orderBy('time').onSnapshot(snap=>{ const box=document.getElementById('msgBox'); box.innerHTML=""; snap.forEach(doc=>{ const m=doc.data(); const r=getRank(m.joinDate,m.sender); const isMe=m.sender===auth.currentUser.email; const isSys=m.sender==="SYSTEM"; const div=document.createElement('div'); div.className=`bubble ${isSys?'system':(isMe?'me':'user')}`; let content=""; if(m.reply) content+=`<div class="reply-box"><b>${m.reply.name}:</b> ${m.reply.text}</div>`; if(m.text) content+=`<div>${m.text}</div>`; if(m.image) content+=`<img src="${m.image}" style="max-width:100%; border-radius:8px; margin-top:5px" onerror="this.src='https://via.placeholder.com/150?text=Error+Image'">`; div.innerHTML=`${!isSys?`<div style="font-size:0.6rem; margin-bottom:4px; font-weight:bold" onclick="setReply('${m.name}','${m.text||'صورة'}')"><span class="rank ${r.c}">${r.n}</span> ${m.name} <i class="fas fa-reply" style="opacity:0.5; margin-right:5px; cursor:pointer"></i></div>`:''} ${content} ${(auth.currentUser.email===FOUNDER_ID)?`<i class="fas fa-trash" style="color:red;font-size:10px;cursor:pointer;position:absolute;left:5px;bottom:2px;" onclick="deleteM('${doc.id}')"></i>`:''}`; box.appendChild(div); }); scrollToBottom(50); }); }

function loadAdminPanel(){ db.collection('users').onSnapshot(snap=>{ const list=document.getElementById('userList'); list.innerHTML=""; snap.forEach(doc=>{ const u=doc.data(); if(u.email===FOUNDER_ID)return; const d=document.createElement('div'); d.style="padding:12px; border-bottom:1px solid #222; font-size:0.8rem"; d.innerHTML=`<div style="margin-bottom:8px">${u.name}</div><div style="display:flex; gap:5px"><button onclick="toggleMute('${u.email}')" style="flex:1;background:orange;border:none;padding:5px;border-radius:4px;font-weight:bold;cursor:pointer">ميوت</button><button onclick="ban('${u.email}')" style="flex:1;background:red;color:white;border:none;padding:5px;border-radius:4px;font-weight:bold;cursor:pointer">بان</button></div>`; list.appendChild(d); }); }); }

async function toggleMute(email){ const ref=db.collection('mutes').doc(email); const doc=await ref.get(); doc.exists?await ref.delete():await ref.set({muted:true}); }
async function ban(e){ if(confirm("حظر نهائي؟")) await db.collection('bans').doc(e).set({b:true}); }
async function deleteM(id){ await db.collection('messages').doc(id).delete(); }
async function clearChat(){ if(confirm("مسح كل الرسائل؟")){ const s=await db.collection('messages').get(); s.forEach(d=>d.ref.delete()); } }

// تحسين التحريك التلقائي وارتفاع شريط الإدخال
const msgInputEl=document.getElementById('msgInput');
const msgBoxEl=document.getElementById('msgBox');

function scrollToBottom(delay=0){ setTimeout(()=>{ msgBoxEl.scrollTop=msgBoxEl.scrollHeight; },delay); }

msgInputEl.addEventListener('focus',()=>scrollToBottom(300));
msgInputEl.addEventListener('blur',()=>scrollToBottom(100));
msgInputEl.addEventListener('input',()=>{
  msgInputEl.style.height='auto';
  msgInputEl.style.height=msgInputEl.scrollHeight+'px';
  scrollToBottom(50);
});
</script>
</body>
</html>
